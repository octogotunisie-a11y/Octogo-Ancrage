// Initialize Supabase from global window.supabase (loaded via CDN <script>)
function initSupabase() {
  if (supabaseReady) return supabaseClient;
  if (typeof window === 'undefined' || !window.supabase || !window.supabase.createClient) {
    console.warn('Supabase SDK not loaded — running in localStorage-only mode');
    return null;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  });
  supabaseReady = true;
  return supabaseClient;
}

// Auth: sign in with participant_id + password
async function supabaseLoginParticipant(participantId, password) {
  const sb = initSupabase();
  if (!sb) throw new Error('Supabase non initialisé');
  
  const email = makeParticipantEmail(participantId);
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  return data;
}

// Auth: sign in admin with email + password (admin uses real email)
async function supabaseLoginAdmin(email, password) {
  const sb = initSupabase();
  if (!sb) throw new Error('Supabase non initialisé');
  
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  
  // Verify this user is actually in admin_users
  const { data: adminRow, error: adminErr } = await sb
    .from('admin_users')
    .select('id, full_name, role')
    .eq('auth_user_id', data.user.id)
    .maybeSingle();
  
  if (adminErr || !adminRow) {
    await sb.auth.signOut();
    throw new Error("Ce compte n'est pas administrateur.");
  }
  
  return { user: data.user, admin: adminRow };
}

async function supabaseLogout() {
  const sb = initSupabase();
  if (!sb) return;
  await sb.auth.signOut();
}

// Resolve current session: returns { user, participant, isAdmin } or null
async function supabaseGetCurrentSession() {
  const sb = initSupabase();
  if (!sb) return null;
  
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  
  const user = session.user;
  
  // Check if admin
  const { data: adminRow } = await sb
    .from('admin_users')
    .select('id, full_name')
    .eq('auth_user_id', user.id)
    .maybeSingle();
  
  if (adminRow) {
    return { user, isAdmin: true, adminName: adminRow.full_name };
  }
  
  // Otherwise check participant
  const { data: pRow } = await sb
    .from('participants')
    .select('participant_id, full_name, fonction')
    .eq('auth_user_id', user.id)
    .maybeSingle();
  
  if (pRow) {
    return { user, isAdmin: false, participant: pRow };
  }
  
  return null;
}

// Push a single session (one module) to Supabase for a given participant
async function supabaseSaveSession(participantId, moduleCode) {
  const sb = initSupabase();
  if (!sb) return;
  
  const ud = state.data[participantId];
  if (!ud) return;
  const s = ud.sessions[moduleCode];
  if (!s) return;
  
  const row = {
    participant_id: participantId,
    module_code: moduleCode,
    state: s.state || 'not_started',
    quiz_answers: s.quizAnswers || {},
    quiz_score: s.quizScore,
    quiz_first_try: s.quizFirstTry !== false,
    image_comment: s.imageComment || '',
    cas_pratique: s.casPratique || '',
    current_screen: s.currentScreen || 0,
    stars: s.stars || 0,
    started_at: s.startedAt,
    completed_at: s.completedAt,
    time_spent_ms: s.timeSpentMs || 0,
    last_visit_at: s.lastVisitAt,
    reminders: s.reminders || {}
  };
  
  const { error } = await sb
    .from('responses')
    .upsert(row, { onConflict: 'participant_id,module_code' });
  
  if (error) {
    console.error(`Save session ${participantId}/${moduleCode} failed:`, error);
    showError('Synchronisation cloud impossible — sauvegarde locale OK.');
  }
}

    time_spent_ms: s.timeSpentMs || 0,

const STORAGE_KEY = 'octogo_ancrage_v1';

function loadAllData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    return JSON.parse(raw);
  } catch (e) {
    showError('Lecture des données impossible. Réinitialisation conseillée.');
    return {};
  }
}

// Local save + debounced cloud sync of the currently active session
function saveAllData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  } catch (e) {
    showError('Sauvegarde impossible: ' + e.message);
  }
  
  // Debounced cloud sync (only when authenticated + currently navigating a module)
  if (supabaseReady && state.currentUser && state.currentModule) {
    if (supabaseSyncTimer) clearTimeout(supabaseSyncTimer);
    const code = state.currentUser.type === 'admin' ? FORMATEUR.code : state.currentUser.code;
    const mod = state.currentModule;
    supabaseSyncTimer = setTimeout(() => {
      // Only sync if this is a real participant (admin uses local-only "FORMATEUR" key not in DB)
      if (state.currentUser.type !== 'admin') {
        supabaseSaveSession(code, mod);
      }
    }, 800);
  }
}

// --- User session helpers ---
function ensureUserData(code) {
  if (!state.data[code]) {
    let participant = PARTICIPANTS.find(p => p.code === code);
    if (!participant && code === FORMATEUR.code) {
      participant = FORMATEUR;
    }
    state.data[code] = {
      code,
      name: participant?.name || code,
      fonction: participant?.fonction || "",
      lastUpdated: new Date().toISOString(),
      sessions: {},
      totalStars: 0,
      leaderboardOptIn: code === FORMATEUR.code ? "out" : null,
      pseudoOptional: ""
    };
    Object.keys(MODULES).forEach(mc => {
      state.data[code].sessions[mc] = createEmptySession();
    });
  } else {
    Object.keys(MODULES).forEach(mc => {
      if (!state.data[code].sessions[mc]) {
        state.data[code].sessions[mc] = createEmptySession();
      }
    });
  }
  return state.data[code];
}

function createEmptySession() {
  return {
    state: "not_started",
    currentScreen: 0,
    quizAnswers: {},
    quizScore: null,
    quizFirstTry: true,
    imageComment: "",
    casPratique: "",
    stars: 0,
    startedAt: null,
    completedAt: null,
    timeSpentMs: 0, // accumulated time spent in module (rough estimate via session events)
    lastVisitAt: null,
    reminders: REMINDER_INTERVALS.reduce((acc, d) => {
      acc[d] = { dueDate: null, completed: false, completedAt: null, score: null };
      return acc;
    }, {})
  };
}

function getUserData() {
  if (!state.currentUser) return null;

  return state.data[state.currentUser.code];

  if (state.currentUser.type === 'admin') return FORMATEUR.code;
  return state.currentUser.code;
}

// --- Stars calculation ---
function calculateStars(session) {
  let stars = 0;
  if (session.state !== 'completed') return 0;
  
  // Star 1: completed
  stars = 1;
  
  // Star 2: quiz > 60%
  if (session.quizScore !== null && session.quizScore > 0.6) stars = 2;
  
  // Star 3: quiz > 80%
  if (session.quizScore !== null && session.quizScore > 0.8) stars = 3;
  
  // Star 4: quiz > 80% + image + cas filled
  if (stars >= 3 && session.imageComment.trim().length > 0 && session.casPratique.trim().length > 0) {
    stars = 4;
  }
  
  // Star 5: 100% first try + all reminders done in time
  const allRemindersDone = REMINDER_INTERVALS.every(d => session.reminders[d].completed);
  if (stars >= 4 && session.quizFirstTry && session.quizScore === 1 && allRemindersDone) {
    stars = 5;
  }
  
  return stars;
}

function recalculateTotalStars(userCode) {
  const ud = state.data[userCode];
  if (!ud) return 0;
  let total = 0;
  Object.values(ud.sessions).forEach(s => total += s.stars || 0);
  ud.totalStars = total;
  return total;
}

// --- Module flow steps ---
// 0..N-1: écran 0..N-1 (5 screens)
// N (5): quiz screen (paginated by question)
// N+1 (6): image stimulus
// N+2 (7): cas pratique
// N+3 (8): completion
function getStepCount(module) {
  return module.ecrans.length + 4; // ecrans + quiz + image + cas + completion
}

function getStepLabel(module, step) {
  const ne = module.ecrans.length;
  if (step < ne) return `Écran ${step + 1} sur ${ne}`;
  if (step === ne) return 'Quiz';
  if (step === ne + 1) return 'Image-stimulus';
  if (step === ne + 2) return 'Cas pratique';
  return 'Bilan';
}

function getStepShortLabel(module, step) {
  const ne = module.ecrans.length;
  if (step < ne) return 'Cours';
  if (step === ne) return 'Quiz';
  if (step === ne + 1) return 'Image';
  if (step === ne + 2) return 'Pratique';
  return 'Bilan';
}

// GLOBAL REMINDERS — rappels d'ancrage planifiés depuis la 1re connexion
// =============================================================
// 5 paliers J+1 / J+3 / J+7 / J+15 / J+30 calculés depuis firstLoginAt.
// Source de vérité : table public.participants (Supabase) — colonnes
// first_login_at + global_reminders. Lecture / écriture via RPC.
// =============================================================

// Configuration des contenus de chaque palier (ancres neuroscientifiques)
const GLOBAL_REMINDER_CONFIG = {
  1:  { title: 'Premier engagement',           hint: 'Jour 1 du parcours — pose ton intention et démarre le premier module.' },
  3:  { title: 'Effet d\'espacement initial',   hint: 'Jour 3 — re-traversée des premiers contenus avant la phase d\'oubli.' },
  7:  { title: 'Reprise spaced retrieval',     hint: 'Jour 7 — réactivation à la fin de la première semaine.' },
  15: { title: 'Consolidation mi-parcours',    hint: 'Jour 15 — bilan d\'étape : ce qui s\'est ancré, ce qui s\'efface.' },
  30: { title: 'Ancrage de transfert',         hint: 'Jour 30 — fin du protocole d\'ancrage standard, transfert en pratique réelle.' }
};

// Appel post-login : capte la 1re connexion + récupère le statut des rappels globaux
async function syncFirstLoginAndGlobalReminders(participantId) {
  try {
    const sb = initSupabase();
    if (!sb) return;
    const { data, error } = await sb.rpc('touch_session_and_get_profile');
    if (error) { console.warn('touch_session_and_get_profile failed:', error); return; }
    if (!data) return;
    
    const ud = state.data[participantId];
    if (!ud) return;
    
    // v5 — ancre hybride :
    //   priorité à data.anchor_at (MIN(responses.created_at) si existe, sinon first_login_at)
    //   repli pour compat ascendante v4 : data.first_login_at
    ud.firstLoginAt      = data.anchor_at || data.first_login_at || null;  // CHANGED — utilisé par getGlobalReminders
    ud.firstLoginRaw     = data.first_login_at  || null;                   // NEW — 1re connexion stricte (lecture admin / debug)
    ud.firstResponseAt   = data.first_response_at || null;                  // NEW — 1re activité module (lecture admin / debug)
    
    // global_reminders attendu : { "1": { completed_at: "..." }, "3": { ... }, ... }
    const done = {};
    if (data.global_reminders && typeof data.global_reminders === 'object') {
      Object.keys(data.global_reminders).forEach(k => {
        const entry = data.global_reminders[k];
        if (entry && entry.completed_at) {
          done[k] = entry.completed_at;
        }
      });
    }
    ud.globalRemindersDone = done;
    saveAllData();
  } catch (e) {
    console.warn('syncFirstLoginAndGlobalReminders error:', e);
  }
}

// Construit la liste des 5 rappels globaux avec leur statut courant
function getGlobalReminders(userCode) {
  const ud = state.data[userCode];
  if (!ud || !ud.firstLoginAt) return [];
  
  const firstLogin = new Date(ud.firstLoginAt);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const done = ud.globalRemindersDone || {};
  
  return REMINDER_INTERVALS.map(d => {
    const due = new Date(firstLogin);
    due.setDate(due.getDate() + (d - 1));   // CHANGE — J+1 = jour de 1re connexion (jour 1 du parcours)
    due.setHours(0, 0, 0, 0);
    
    const completedAt = done[String(d)] || null;
    let status;
    if (completedAt)               status = 'done';
    else if (due.getTime() < today.getTime())  status = 'overdue';
    else if (due.getTime() === today.getTime()) status = 'today';
    else                            status = 'upcoming';
    
    const diffDays = Math.round((due.getTime() - today.getTime()) / 86400000);
    
    return {
      day: d,
      dueDate: due.toISOString(),
      status,
      completedAt,
      diffDays,
      title: GLOBAL_REMINDER_CONFIG[d]?.title || `J+${d}`,
      hint:  GLOBAL_REMINDER_CONFIG[d]?.hint  || ''
    };
  });
}

// Marque un palier comme fait (RPC + état local + re-render)
async function markGlobalReminderDone(day) {
  try {
    const sb = initSupabase();
    if (!sb) return;
    const code = getActiveUserCode();
    if (!code) return;
    
    const { data, error } = await sb.rpc('mark_global_reminder_done', { p_day: day });
    if (error) { console.warn('mark_global_reminder_done failed:', error); return; }
    
    const ud = state.data[code];
    if (!ud) return;
    ud.globalRemindersDone = ud.globalRemindersDone || {};
    
    // Met à jour localement à partir du retour RPC
    if (data && typeof data === 'object') {
      Object.keys(data).forEach(k => {
        if (data[k] && data[k].completed_at) {
          ud.globalRemindersDone[k] = data[k].completed_at;
        }
      });
    } else {
      ud.globalRemindersDone[String(day)] = new Date().toISOString();
    }
    saveAllData();
    renderApp();
  } catch (e) {
    console.warn('markGlobalReminderDone error:', e);
  }
}

  // Appelle la RPC sans relancer renderApp() (qui détruirait la modale en cours)
  try {
    const sb = initSupabase();
    if (!sb) return;
    const code = getActiveUserCode();
    if (!code) return;
    
    const { data, error } = await sb.rpc('mark_global_reminder_done', { p_day: day });
    if (error) { console.warn('mark_global_reminder_done (modal) failed:', error); return; }
    
    const ud = state.data[code];
    if (ud) {
      ud.globalRemindersDone = ud.globalRemindersDone || {};
      const k = String(day);

        ud.globalRemindersDone[k] = data[k].completed_at;

    // Met à jour visuellement la carte dans la modale (sans la détruire)

// --- Reminder scheduling ---
function scheduleReminders(session) {
  if (!session.completedAt) return;
  const completedDate = new Date(session.completedAt);
  REMINDER_INTERVALS.forEach(d => {
    if (!session.reminders[d].dueDate) {
      const due = new Date(completedDate);
      due.setDate(due.getDate() + d);
      session.reminders[d].dueDate = due.toISOString();
    }
  });
}

function getRemindersStatus(userCode) {
  const ud = state.data[userCode];
  if (!ud) return { overdue: [], today: [], upcoming: [], done: [] };
  const now = Date.now();
  const dayMs = 86400000;
  const overdue = [], today = [], upcoming = [], done = [];
  
  Object.entries(ud.sessions).forEach(([moduleCode, session]) => {
    REMINDER_INTERVALS.forEach(d => {
      const r = session.reminders[d];
      if (!r.dueDate) return;
      const dueTs = new Date(r.dueDate).getTime();
      const item = { moduleCode, day: d, dueDate: r.dueDate, completed: r.completed, completedAt: r.completedAt, score: r.score };
      if (r.completed) {
        done.push(item);
      } else if (dueTs < now - dayMs) {
        overdue.push(item);
      } else if (dueTs >= now - dayMs && dueTs <= now + dayMs) {
        today.push(item);
      } else if (dueTs > now + dayMs) {
        upcoming.push(item);
      }
    });
  });
  
  // Sort
  overdue.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
  today.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
  upcoming.sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));
  done.sort((a,b) => new Date(b.completedAt) - new Date(a.completedAt));
  
  return { overdue, today, upcoming, done };
}

// --- Markdown-lite rendering for body content ---
function renderMarkdown(text) {
  if (!text) return '';
  // Escape HTML
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  
  // Bold **...**
  html = html.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  // Italic *...*
  html = html.replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g, '<em>$1</em>');
  
  // Lists (lines starting with "- " or "* ")
  const lines = html.split('\n');
  let inList = false;
  let result = [];
  let inOl = false;
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const ulMatch = line.match(/^- (.+)$/);
    const olMatch = line.match(/^(\d+)\.\s+(.+)$/);
    
    if (ulMatch) {
      if (inOl) { result.push('</ol>'); inOl = false; }
      if (!inList) { result.push('<ul>'); inList = true; }
      result.push(`<li>${ulMatch[1]}</li>`);
    } else if (olMatch) {
      if (inList) { result.push('</ul>'); inList = false; }
      if (!inOl) { result.push('<ol>'); inOl = true; }
      result.push(`<li>${olMatch[2]}</li>`);
    } else {
      if (inList) { result.push('</ul>'); inList = false; }
      if (inOl) { result.push('</ol>'); inOl = false; }
      if (line.trim() === '') {
        result.push('');
      } else {
        result.push(`<p>${line}</p>`);
      }
    }
  }
  if (inList) result.push('</ul>');
  if (inOl) result.push('</ol>');
  
  return result.join('\n');
}

// --- Date formatting ---
function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

function formatDateLong(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function handleParticipantLogin(ev) {
  ev.preventDefault();
  const nameInput = document.getElementById('login-pid');
  const pwdInput = document.getElementById('login-pwd');
  const errEl = document.getElementById('login-error-participant');
  const btn = document.getElementById('login-submit-participant');
  
  const name = nameInput.value.trim();
  const pwd = pwdInput.value;
  
  if (!name || !pwd) {
    errEl.textContent = 'Nom et mot de passe requis.';
    return;
  }
  
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  
  try {
    const sb = initSupabase();
    if (!sb) throw new Error('Connexion au serveur impossible.');
    
    // Step 1 : translate name → email via the public RPC function
    const { data: email, error: lookupErr } = await sb.rpc('get_email_by_name', { p_name: name });
    
    if (lookupErr) throw new Error('Erreur serveur : ' + lookupErr.message);
    if (!email) throw new Error('Nom introuvable. Vérifiez l\'orthographe.');
    
    // Step 2 : sign in with that email + password
    const { data: signInData, error: signInErr } = await sb.auth.signInWithPassword({ email, password: pwd });
    if (signInErr) throw new Error('Mot de passe incorrect.');
    
    // Step 3 : fetch the full participant record
    const { data: pRow, error: pErr } = await sb
      .from('participants')
      .select('participant_id, full_name, fonction, is_active')
      .eq('auth_user_id', signInData.user.id)
      .maybeSingle();
    
    if (pErr || !pRow) throw new Error('Profil participant introuvable.');
    if (!pRow.is_active) throw new Error('Compte désactivé. Contactez le formateur.');
    
    // Step 4 : load this participant's data from cloud
    await supabaseLoadParticipantData(pRow.participant_id);
    
    // Step 4b : NEW — capter la 1re connexion (RPC idempotente : COALESCE côté SQL)
    await syncFirstLoginAndGlobalReminders(pRow.participant_id);
    
    state.currentUser = { type: 'participant', code: pRow.participant_id, name: pRow.full_name };
    state.currentView = 'dashboard';
    saveAllData();
    renderApp();
    setTimeout(showGlobalReminderAlert, 350); // NEW — modale auto si rappels dus
  } catch (e) {
    errEl.textContent = e.message || 'Connexion impossible.';
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
}

  saveAllData();
  renderApp();
}

function renderMainContent() {

    case 'palmares': return renderPalmares();
    case 'admin': return renderAdmin();
    case 'admin-detail': return renderAdminDetail();
    case 'reminder-quiz': return renderReminderQuiz();
    default: return '<p>Vue inconnue.</p>';

  // Priority 3: next not_started in TRIVIUM order

            const isNextClass = j.isNext ? 'is-next' : '';

function openModuleAtStep(code, stepIdx) {
  const module = MODULES[code];
  if (!module) { showError('Module introuvable: ' + code); return; }
  
  state.currentModule = code;
  state.currentView = 'module';
  state.currentStep = stepIdx;
  state.currentQuizIndex = 0;
  state.quizAnswered = false;
  state.selectedAnswer = null;
  
  const ud = getUserData();
  const session = ud.sessions[code];
  const now = new Date().toISOString();
  if (session.state === 'not_started') {
    session.state = 'in_progress';
    session.startedAt = now;
  }
  if ((session.currentScreen || 0) < stepIdx) {
    session.currentScreen = stepIdx;
  }
  session.lastVisitAt = now;
  saveAllData();
  
  document.getElementById('sidebar')?.classList.remove('open');
  
  renderApp();
  scrollToTopOfContent();
}

// =============================================================
// MODULE VIEW
// =============================================================

function openModule(code) {
  const module = MODULES[code];
  if (!module) { showError('Module introuvable: ' + code); return; }
  
  state.currentModule = code;
  state.currentView = 'module';
  
  const ud = getUserData();
  const session = ud.sessions[code];
  
  // If completed, restart from beginning (review)
  // If in progress, resume at currentScreen
  // If not started, start at 0
  state.currentStep = session.state === 'in_progress' ? session.currentScreen : 0;
  state.currentQuizIndex = 0;
  state.quizAnswered = false;
  state.selectedAnswer = null;
  
  const now = new Date().toISOString();
  if (session.state === 'not_started') {
    session.state = 'in_progress';
    session.currentScreen = 0;
    session.startedAt = now;
  }
  // Track entry time for duration accumulation
  session.lastVisitAt = now;
  saveAllData();
  
  // Close mobile sidebar
  document.getElementById('sidebar')?.classList.remove('open');
  
  renderApp();
  scrollToTopOfContent();
}

// Accumulate time spent when leaving the module (cap at 5 min per visit to avoid inflated stats from idle tabs)
function accumulateModuleTime() {
  if (state.currentView !== 'module' || !state.currentModule) return;
  const ud = getUserData();
  if (!ud) return;
  const session = ud.sessions[state.currentModule];
  if (!session || !session.lastVisitAt) return;
  const elapsed = Date.now() - new Date(session.lastVisitAt).getTime();
  // Cap at 5 minutes (300_000 ms) per visit chunk to ignore long idle periods
  const capped = Math.min(elapsed, 5 * 60 * 1000);
  if (capped > 0) {
    session.timeSpentMs = (session.timeSpentMs || 0) + capped;
    session.lastVisitAt = new Date().toISOString();
  }
}

function renderModule() {
  const module = MODULES[state.currentModule];
  if (!module) return '<p>Module introuvable.</p>';
  
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  const colorClass = COLOR_MAP[module.color] || 'module-navy';
  const ne = module.ecrans.length;
  const isAdmin = state.currentUser.type === 'admin';
  const moduleCompleted = session.state === 'completed';
  
  let stepContent = '';
  
  if (state.currentStep < ne) {
    stepContent = renderEcran(module.ecrans[state.currentStep], module);
  } else if (state.currentStep === ne) {
    stepContent = renderQuiz(module, session);
  } else if (state.currentStep === ne + 1) {
    stepContent = renderImageStimulus(module, session);
  } else if (state.currentStep === ne + 2) {
    stepContent = renderCasPratique(module, session);
  } else {
    stepContent = renderCompletion(module, session);
  }
  
  // Step navigator: all phases clickable by everyone (free navigation by design)
  const canJump = (stepIdx) => true;
  
  const phases = [
    { label: 'Cours', start: 0, count: ne, single: false },
    { label: 'Quiz', start: ne, count: 1, single: true },
    { label: 'Image', start: ne + 1, count: 1, single: true },
    { label: 'Cas pratique', start: ne + 2, count: 1, single: true },
    { label: 'Bilan', start: ne + 3, count: 1, single: true }
  ];
  
  const phaseHtml = phases.map(phase => {
    const dots = Array.from({length: phase.count}, (_, i) => {
      const stepIdx = phase.start + i;
      const completed = stepIdx < state.currentStep;
      const current = stepIdx === state.currentStep;
      const classes = [
        'step-dot',
        completed ? 'completed' : '',
        current ? 'current' : '',
        'clickable'
      ].filter(Boolean).join(' ');
      const label = phase.single ? phase.label : `Écran ${i + 1}`;
      return `<button class="${classes}" onclick="goToStep(${stepIdx})" title="${label}" aria-label="${label}"></button>`;
    }).join('');
    
    const inPhase = state.currentStep >= phase.start && state.currentStep < phase.start + phase.count;
    const phasePassed = state.currentStep >= phase.start + phase.count;
    const phaseClasses = ['step-phase'];
    if (inPhase) phaseClasses.push('current-phase');
    if (phasePassed) phaseClasses.push('passed-phase');
    
    let subProgress = '';
    if (!phase.single && phase.count > 1) {
      const inThisPhase = inPhase ? state.currentStep - phase.start + 1 : (phasePassed ? phase.count : 0);
      subProgress = `<div class="step-phase-sub">${inThisPhase} / ${phase.count}</div>`;
    }
    
    return `
      <div class="${phaseClasses.join(' ')}">
        <div class="step-dot-row">${dots}</div>
        <div class="step-phase-label" onclick="goToStep(${phase.start})" style="cursor:pointer">${phase.label}</div>
        ${subProgress}
      </div>
    `;
  }).join('<div class="step-phase-separator"></div>');
  
  const helpHint = `<div class="step-nav-hint">⌁ Accès libre à n'importe quelle étape — Cours, Quiz, Image, Cas pratique, Bilan.</div>`;
  
  // Quick-access buttons (direct shortcut bar)
  const quickAccess = `
    <div class="quick-access-bar">
      <button class="quick-access-btn ${state.currentStep < ne ? 'active' : ''}" onclick="goToStep(0)">
        <span class="qa-icon">📖</span><span class="qa-label">Cours</span>
      </button>
      <button class="quick-access-btn ${state.currentStep === ne ? 'active' : ''}" onclick="goToStep(${ne})">
        <span class="qa-icon">❓</span><span class="qa-label">Quiz</span>
      </button>
      <button class="quick-access-btn ${state.currentStep === ne + 1 ? 'active' : ''}" onclick="goToStep(${ne + 1})">
        <span class="qa-icon">🖼</span><span class="qa-label">Image</span>
      </button>
      <button class="quick-access-btn ${state.currentStep === ne + 2 ? 'active' : ''}" onclick="goToStep(${ne + 2})">
        <span class="qa-icon">⚙</span><span class="qa-label">Cas pratique</span>
      </button>
      <button class="quick-access-btn ${state.currentStep === ne + 3 ? 'active' : ''}" onclick="goToStep(${ne + 3})">
        <span class="qa-icon">★</span><span class="qa-label">Bilan / Résultats</span>
      </button>
    </div>
  `;
  
  // Progress percentage (0-100)
  const totalSteps = getStepCount(module);
  const progressPct = Math.round(((state.currentStep + 1) / totalSteps) * 100);
  const stepShortLabel = getStepShortLabel(module, state.currentStep);
  const stepLongLabel = getStepLabel(module, state.currentStep);
  
  return `
    <div class="module-view ${colorClass} fade-in">
      <div class="module-hero">
        <div class="module-hero-inner">
          <div class="module-hero-code">${module.code} · ${SESSION_INFO[module.session].label}</div>
          <h1>${module.title}</h1>
          <p>${module.subtitle}</p>
          <div class="module-hero-meta">
            <span>⏱ ${module.duration}</span>
            <span>${ne} écrans · ${module.questions.length} QCM · 1 image · 1 cas pratique</span>
          </div>
          ${quickAccess}
        </div>
      </div>
      
      <div class="module-sticky-bar">
        <div class="module-progress-line">
          <div class="module-progress-info">
            <span class="module-progress-step-num">Étape ${state.currentStep + 1}</span>
            <span class="module-progress-step-of">sur ${totalSteps}</span>
            <span class="module-progress-step-label">· ${stepShortLabel}</span>
            <span class="module-progress-pct">${progressPct}%</span>
          </div>
          <div class="module-progress-track">
            <div class="module-progress-fill" style="width: ${progressPct}%"></div>
          </div>
        </div>
        
        <nav class="step-timeline" aria-label="Navigation du module">
          ${phaseHtml}
        </nav>
        ${helpHint}
      </div>
      
      <div class="module-content-wrapper">
        ${stepContent}
      </div>
    </div>
  `;
}

function goToStep(idx) {
  const module = MODULES[state.currentModule];
  if (!module) return;
  const total = getStepCount(module);
  if (idx < 0 || idx >= total) return;
  
  accumulateModuleTime();
  state.currentStep = idx;
  state.currentQuizIndex = 0;
  state.quizAnswered = false;
  state.selectedAnswer = null;
  
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  if ((session.currentScreen || 0) < idx) {
    session.currentScreen = idx;
  }
  saveAllData();
  renderApp();
  scrollToTopOfContent();
}

function renderEcran(ecran, module) {

  return `
    <div class="ecran-screen fade-in">
      <div class="ecran-num">Écran ${ecran.num} / ${ne}</div>
      <h2>${ecran.title}</h2>

      <div class="ecran-body">${renderMarkdown(ecran.body)}</div>
      ${ecran.citation ? `<div class="citation-block">${renderMarkdown(ecran.citation)}</div>` : ''}
      <div class="nav-bar">
        ${state.currentStep > 0 ? '<button class="btn btn-secondary" onclick="prevStep()">← Précédent</button>' : '<span></span>'}
        <button class="btn" onclick="nextStep()">Suivant →</button>
      </div>
    </div>
  `;
}

function renderQuiz(module, session) {
  const q = module.questions[state.currentQuizIndex];
  if (!q) return '<p>Quiz vide.</p>';
  
  const totalQ = module.questions.length;
  const progress = ((state.currentQuizIndex + 1) / totalQ) * 100;
  const answered = state.quizAnswered;
  const userAnswer = state.selectedAnswer;
  
  return `
    <div class="quiz-screen fade-in">
      <div class="quiz-progress">
        <span>Question ${state.currentQuizIndex + 1} / ${totalQ}</span>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width: ${progress}%"></div></div>
      </div>
      
      <div class="quiz-question">${q.text}</div>
      
      <div class="quiz-options">
        ${q.options.map((opt, idx) => {
          let cls = '';
          if (answered) {
            if (idx === q.correct) cls = 'correct';
            else if (idx === userAnswer) cls = 'incorrect';
          } else if (userAnswer === idx) {
            cls = 'selected';
          }
          const letter = String.fromCharCode(65 + idx);
          return `
            <button class="quiz-option ${cls}" ${answered ? 'disabled' : ''} onclick="selectAnswer(${idx})">
              <span class="quiz-option-letter">${letter}</span>
              <span>${opt}</span>
            </button>
          `;
        }).join('')}
      </div>
      
      ${answered ? `
        <div class="quiz-explanation">
          <span class="quiz-explanation-label">Explication</span>
          ${renderMarkdown(q.explanation)}
        </div>
        <div class="nav-bar">
          <button class="btn btn-secondary" onclick="prevStep()">← Précédent</button>
          <button class="btn" onclick="nextQuizQuestion()">${state.currentQuizIndex + 1 < totalQ ? 'Question suivante →' : 'Terminer le quiz →'}</button>
        </div>
      ` : `
        <div class="nav-bar">
          <button class="btn btn-secondary" onclick="prevStep()">← Précédent</button>
          <button class="btn" onclick="validateAnswer()" ${userAnswer === null ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>Valider</button>
        </div>

}

// === Module navigation actions ===

function nextStep() {
  const module = MODULES[state.currentModule];
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  const total = getStepCount(module);
  
  if (state.currentStep < total - 1) {
    accumulateModuleTime();
    state.currentStep++;
    session.currentScreen = state.currentStep;
    state.quizAnswered = false;
    state.selectedAnswer = null;
    saveAllData();
    renderApp();
    scrollToTopOfContent();
  }
}

function prevStep() {
  if (state.currentStep > 0) {
    accumulateModuleTime();
    state.currentStep--;
    state.quizAnswered = false;
    state.selectedAnswer = null;
    
    const ud = getUserData();
    const session = ud.sessions[state.currentModule];
    session.currentScreen = state.currentStep;
    saveAllData();
    
    renderApp();
    scrollToTopOfContent();
  }
}

function selectAnswer(idx) {
  state.selectedAnswer = idx;
  renderApp();
}

function validateAnswer() {
  if (state.selectedAnswer === null) return;
  
  const module = MODULES[state.currentModule];
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  const q = module.questions[state.currentQuizIndex];
  
  const previouslyAnswered = session.quizAnswers[state.currentQuizIndex] !== undefined;
  if (!previouslyAnswered && state.selectedAnswer !== q.correct) {
    session.quizFirstTry = false;
  }
  
  session.quizAnswers[state.currentQuizIndex] = state.selectedAnswer;
  state.quizAnswered = true;
  
  saveAllData();
  renderApp();
}

function nextQuizQuestion() {
  const module = MODULES[state.currentModule];
  if (state.currentQuizIndex < module.questions.length - 1) {
    state.currentQuizIndex++;
    state.quizAnswered = false;
    state.selectedAnswer = null;
    renderApp();
    scrollToTopOfContent();
  } else {
    computeQuizScore();
    nextStep();
  }
}

function computeQuizScore() {
  const module = MODULES[state.currentModule];
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  
  let correct = 0;
  module.questions.forEach((q, idx) => {
    if (session.quizAnswers[idx] === q.correct) correct++;
  });
  session.quizScore = correct / module.questions.length;
  saveAllData();
}

function updateImageComment(value) {
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  session.imageComment = value;
  saveAllData();
}

function updateCasPratique(value) {
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  session.casPratique = value;
  saveAllData();
}

function completeModule() {
  accumulateModuleTime();
  const ud = getUserData();
  const session = ud.sessions[state.currentModule];
  session.state = 'completed';
  session.completedAt = new Date().toISOString();
  session.stars = calculateStars(session);
  
  scheduleReminders(session);
  
  recalculateTotalStars(getActiveUserCode());
  state.currentStep = getStepCount(MODULES[state.currentModule]) - 1;
  saveAllData();
  renderApp();
  scrollToTopOfContent();
}

      ${globalRems.length > 0 ? `
        <div class="reminder-section global-section">
          <div class="reminder-section-title">Parcours d'ancrage (depuis ma 1re connexion)</div>

        <div class="reminder-section">

          <div class="reminder-list">
            ${status.overdue.map(r => renderReminderCard(r, 'overdue')).join('')}

          <div class="reminder-list">
            ${status.upcoming.slice(0, 10).map(r => renderReminderCard(r, '')).join('')}
          </div>
        </div>
      ` : ''}
      
      ${status.done.length > 0 ? `
        <div class="reminder-section">
          <div class="reminder-section-title">Effectués (${status.done.length})</div>

function renderReminderCard(r, cls) {
  const module = MODULES[r.moduleCode];
  const due = new Date(r.dueDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const dueDay = new Date(due); dueDay.setHours(0,0,0,0);
  const diffDays = Math.round((dueDay - today) / 86400000);
  let dueLabel = formatDateLong(r.dueDate);
  if (diffDays === 0) dueLabel = 'Aujourd\'hui';
  else if (diffDays === 1) dueLabel = 'Demain';
  else if (diffDays === -1) dueLabel = 'Hier';
  else if (diffDays < 0) dueLabel = `Il y a ${-diffDays} jours`;
  else dueLabel = `Dans ${diffDays} jours`;
  
  const colorClass = COLOR_MAP[module?.color] || 'module-navy';
  
  if (cls === 'done') {
    return `
      <div class="reminder-card ${colorClass}" style="opacity:0.7;">
        <div class="reminder-day-badge">J+${r.day}</div>
        <div class="reminder-info">
          <div class="reminder-module">${r.moduleCode} · ${module.title}</div>
          <div class="reminder-due" style="color:var(--gold);">✓ Effectué · score ${Math.round((r.score || 0) * 100)}%</div>
        </div>
      </div>
    `;
  }
  
  return `
    <div class="reminder-card ${cls} ${colorClass}" onclick="${cls === 'overdue' || cls === 'due-today' || cls === '' ? `startReminderQuiz('${r.moduleCode}', ${r.day})` : ''}" style="cursor:${cls === 'overdue' || cls === 'due-today' ? 'pointer' : 'default'};">
      <div class="reminder-day-badge">J+${r.day}</div>
      <div class="reminder-info">
        <div class="reminder-module">${r.moduleCode} · ${module.title}</div>
        <div class="reminder-due">${dueLabel}</div>
      </div>
      ${cls === 'overdue' || cls === 'due-today' ? '<button class="btn btn-gold" style="padding:8px 16px;font-size:13px;">Réviser →</button>' : ''}
    </div>
  `;
}
function renderGlobalReminderCard(g) {
  const dueLabel = (() => {
    if (g.status === 'done') {
      const d = new Date(g.completedAt);
      return `✓ fait le ${formatDate(d.toISOString())}`;
    }
    if (g.status === 'today')   return 'aujourd\'hui';
    if (g.status === 'overdue') return `en retard de ${Math.abs(g.diffDays)} j`;
    if (g.diffDays === 1)        return 'demain';
    return `dans ${g.diffDays} jours · ${formatDate(g.dueDate)}`;
  })();
  
  const clickable = (g.status === 'overdue' || g.status === 'today');
  const onclick   = clickable ? `onclick="markGlobalReminderDone(${g.day})"` : '';
  const cursor    = clickable ? 'pointer' : 'default';
  
  return `
    <div class="global-reminder-card ${g.status}" ${onclick} style="cursor:${cursor};">
      <div class="global-reminder-day">J+${g.day}</div>
      <div class="global-reminder-body">
        <div class="global-reminder-title">${g.title}</div>
        <div class="global-reminder-hint">${g.hint}</div>
        <div class="global-reminder-due">${dueLabel}</div>
        ${clickable ? '<div class="global-reminder-cta">→ Marquer comme fait</div>' : ''}
      </div>
    </div>
  `;
}
function startReminderQuiz(moduleCode, day) {
  const module = MODULES[moduleCode];
  if (!module) return;
  
  // Pick 3 random questions
  const shuffled = [...module.questions].sort(() => Math.random() - 0.5);
  const questions = shuffled.slice(0, 3);
  
  state.reminderQuiz = {
    moduleCode, day, questions,
    currentIndex: 0,
    answers: [],
    score: 0,
    answered: false,
    selectedAnswer: null
  };
  state.currentView = 'reminder-quiz';
  renderApp();
}

function renderReminderQuiz() {
  const rq = state.reminderQuiz;
  if (!rq) { state.currentView = 'reminders'; return renderReminders(); }
  
  const module = MODULES[rq.moduleCode];
  const colorClass = COLOR_MAP[module.color] || 'module-navy';
  
  if (rq.currentIndex >= rq.questions.length) {
    // Done — show summary
    const scorePct = Math.round((rq.score / rq.questions.length) * 100);
    return `
      <div class="completion-screen ${colorClass} fade-in">
        <div class="completion-icon">✓</div>
        <h2>Rappel J+${rq.day} terminé</h2>
        <p class="completion-sub">${module.code} — ${module.title}</p>
        <div class="stars-big" style="font-size:36px;">Score: ${scorePct}%</div>
        <p style="color:var(--text-soft);font-size:14px;margin-bottom:24px;">${rq.score} / ${rq.questions.length} bonnes réponses</p>
        <div class="nav-bar" style="justify-content:center;">
          <button class="btn" onclick="closeReminderQuiz()">Retour aux rappels</button>
        </div>
      </div>
    `;
  }
  
  const q = rq.questions[rq.currentIndex];
  const totalQ = rq.questions.length;
  const progress = ((rq.currentIndex + 1) / totalQ) * 100;
  
  return `
    <div class="quiz-screen ${colorClass} fade-in">
      <div style="margin-bottom:20px;padding:14px 18px;background:var(--gold-pale);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;font-size:13px;">
        <strong>Rappel J+${rq.day}</strong> · ${module.code} — ${module.title}
      </div>
      
      <div class="quiz-progress">
        <span>Question ${rq.currentIndex + 1} / ${totalQ}</span>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width: ${progress}%"></div></div>
      </div>
      
      <div class="quiz-question">${q.text}</div>
      
      <div class="quiz-options">
        ${q.options.map((opt, idx) => {
          let cls = '';
          if (rq.answered) {
            if (idx === q.correct) cls = 'correct';
            else if (idx === rq.selectedAnswer) cls = 'incorrect';
          } else if (rq.selectedAnswer === idx) {
            cls = 'selected';
          }
          const letter = String.fromCharCode(65 + idx);
          return `
            <button class="quiz-option ${cls}" ${rq.answered ? 'disabled' : ''} onclick="selectReminderAnswer(${idx})">
              <span class="quiz-option-letter">${letter}</span>
              <span>${opt}</span>
            </button>
          `;
        }).join('')}
      </div>
      
      ${rq.answered ? `
        <div class="quiz-explanation">
          <span class="quiz-explanation-label">Explication</span>
          ${renderMarkdown(q.explanation)}
        </div>
        <div class="nav-bar" style="justify-content:flex-end;">
          <button class="btn" onclick="nextReminderQuestion()">${rq.currentIndex + 1 < totalQ ? 'Question suivante →' : 'Terminer →'}</button>
        </div>
      ` : `
        <div class="nav-bar" style="justify-content:flex-end;">
          <button class="btn" onclick="validateReminderAnswer()" ${rq.selectedAnswer === null ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>Valider</button>
        </div>
      `}
    </div>
  `;
}

function selectReminderAnswer(idx) {
  state.reminderQuiz.selectedAnswer = idx;
  renderApp();
}

function validateReminderAnswer() {
  const rq = state.reminderQuiz;
  if (rq.selectedAnswer === null) return;
  const q = rq.questions[rq.currentIndex];
  if (rq.selectedAnswer === q.correct) rq.score++;
  rq.answers.push(rq.selectedAnswer);
  rq.answered = true;
  renderApp();
}

function nextReminderQuestion() {
  const rq = state.reminderQuiz;
  rq.currentIndex++;
  rq.answered = false;
  rq.selectedAnswer = null;
  
  if (rq.currentIndex >= rq.questions.length) {
    // Mark reminder as completed
    const ud = getUserData();
    const session = ud.sessions[rq.moduleCode];
    if (session.reminders[rq.day]) {
      session.reminders[rq.day].completed = true;
      session.reminders[rq.day].completedAt = new Date().toISOString();
      session.reminders[rq.day].score = rq.score / rq.questions.length;
    }
    // Recompute stars (5th star depends on reminders)
    session.stars = calculateStars(session);
    recalculateTotalStars(getActiveUserCode());
    saveAllData();
  }
  renderApp();
}

function closeReminderQuiz() {
  state.reminderQuiz = null;
  state.currentView = 'reminders';
  renderApp();
}

function formatDuration(ms) {
  if (!ms || ms < 1000) return '0 min';
  const totalMinutes = Math.round(ms / 60000);
  if (totalMinutes < 60) return `${totalMinutes} min`;
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  return m > 0 ? `${h}h ${m}min` : `${h}h`;
}

function computeCohortAverages() {
  // Average across all participants (excluding FORMATEUR), only those who started
  const participants = Object.entries(state.data)
    .filter(([k, _]) => k !== FORMATEUR.code)
    .map(([_, v]) => v)
    .filter(v => v.totalStars > 0 || Object.values(v.sessions || {}).some(s => s.state === 'completed'));
  
  if (participants.length === 0) return null;
  
  const avg = {
    totalStars: 0,
    moduleScores: {}, // M1..M10 -> avg score
    remindersOnTime: { 1: 0, 3: 0, 7: 0, 15: 0, 30: 0 },
    reminderCounts: { 1: 0, 3: 0, 7: 0, 15: 0, 30: 0 },
    completedCount: 0,
    perfectFirstTry: 0,
    timeSpentMs: 0,
    n: participants.length
  };
  
  participants.forEach(p => {
    avg.totalStars += p.totalStars || 0;
    Object.entries(p.sessions || {}).forEach(([code, s]) => {
      if (s.quizScore !== null && s.quizScore !== undefined) {
        if (!avg.moduleScores[code]) avg.moduleScores[code] = { sum: 0, count: 0 };
        avg.moduleScores[code].sum += s.quizScore;
        avg.moduleScores[code].count++;
      }
      if (s.state === 'completed') {
        avg.completedCount++;
        if (s.quizFirstTry && s.quizScore === 1) avg.perfectFirstTry++;
        avg.timeSpentMs += s.timeSpentMs || 0;
      }
      // Reminders done on time
      REMINDER_INTERVALS.forEach(d => {
        const r = s.reminders?.[d];
        if (r?.dueDate) {
          avg.reminderCounts[d]++;
          if (r.completed) {
            const dueTime = new Date(r.dueDate).getTime();
            const completedTime = r.completedAt ? new Date(r.completedAt).getTime() : 0;
            if (completedTime <= dueTime + 24 * 60 * 60 * 1000) {
              avg.remindersOnTime[d]++;
            }
          }
        }
      });
    });
  });
  
  // Compute averages
  const result = {
    totalStars: avg.totalStars / avg.n,
    moduleScores: {},
    remindersOnTimePct: {},
    completedAvg: avg.completedCount / avg.n,
    perfectFirstTryAvg: avg.perfectFirstTry / avg.n,
    timeSpentAvgMs: avg.timeSpentMs / avg.n,
    n: avg.n
  };
  
  Object.entries(avg.moduleScores).forEach(([code, { sum, count }]) => {
    result.moduleScores[code] = sum / count;
  });
  REMINDER_INTERVALS.forEach(d => {
    result.remindersOnTimePct[d] = avg.reminderCounts[d] > 0 
      ? (avg.remindersOnTime[d] / avg.reminderCounts[d]) * 100 
      : 0;
  });
  
  return result;
}

function computePersonalStats(ud) {
  const sessions = ud.sessions || {};
  const completed = Object.values(sessions).filter(s => s.state === 'completed');
  
  // Stars accumulation timeline (sorted by completion date)
  const completionEvents = Object.entries(sessions)
    .filter(([_, s]) => s.state === 'completed' && s.completedAt)
    .map(([code, s]) => ({ code, completedAt: s.completedAt, stars: s.stars || 0 }))
    .sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt));
  
  let cumStars = 0;
  const starsTimeline = completionEvents.map(e => {
    cumStars += e.stars;
    return { date: e.completedAt, stars: cumStars, code: e.code };
  });
  
  // Quiz scores per module (M1..M10 in order)
  const orderedCodes = ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'M9', 'M10'];
  const quizScores = orderedCodes.map(code => ({
    code,
    score: sessions[code]?.quizScore !== null && sessions[code]?.quizScore !== undefined 
      ? sessions[code].quizScore : null,
    color: MODULES[code]?.color || 'navy'
  }));
  
  // Reminders performance per interval
  const remindersPerf = REMINDER_INTERVALS.map(d => {
    let total = 0, onTime = 0, late = 0, pending = 0;
    Object.values(sessions).forEach(s => {
      const r = s.reminders?.[d];
      if (r?.dueDate) {
        total++;
        if (r.completed) {
          const dueTime = new Date(r.dueDate).getTime();
          const completedTime = r.completedAt ? new Date(r.completedAt).getTime() : 0;
          if (completedTime <= dueTime + 24 * 60 * 60 * 1000) onTime++;
          else late++;
        } else {
          pending++;
        }
      }
    });
    return { day: d, total, onTime, late, pending, pctOnTime: total > 0 ? (onTime / total) * 100 : 0 };
  });
  
  // Perfect first try modules
  const perfectFirstTry = Object.entries(sessions)
    .filter(([_, s]) => s.state === 'completed' && s.quizFirstTry && s.quizScore === 1)
    .map(([code, s]) => ({ code, title: MODULES[code]?.title || code, completedAt: s.completedAt }));
  
  // Best mastered module (most stars, then highest quiz)
  let bestModule = null;
  Object.entries(sessions).forEach(([code, s]) => {
    if (s.state !== 'completed') return;
    if (!bestModule || s.stars > bestModule.stars || (s.stars === bestModule.stars && (s.quizScore || 0) > bestModule.score)) {
      bestModule = { code, title: MODULES[code]?.title || code, stars: s.stars, score: s.quizScore || 0, color: MODULES[code]?.color || 'navy' };
    }
  });
  
  // Total time spent
  const totalTimeMs = Object.values(sessions).reduce((sum, s) => sum + (s.timeSpentMs || 0), 0);
  
  return {
    completed: completed.length,
    starsTimeline,
    quizScores,
    remindersPerf,
    perfectFirstTry,
    bestModule,
    totalTimeMs,
    totalStars: ud.totalStars || 0
  };
}

function renderPalmares() {
  const ud = getUserData();
  if (!ud) return '<p>Aucune donnée.</p>';
  
  const stats = computePersonalStats(ud);
  const cohort = computeCohortAverages();
  const isAdmin = state.currentUser.type === 'admin';
  
  // Empty state
  if (stats.completed === 0) {
    return `
      <div class="palmares-screen fade-in">

        <div class="palmares-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-7"/></svg>
          <h3>Pas encore de données à afficher</h3>
          <p>Complétez votre premier module pour commencer à construire votre palmarès personnel.</p>
          <button class="btn" onclick="navigateTo('dashboard')">→ Aller aux modules</button>
        </div>

  }
  
  return `
    <div class="palmares-screen fade-in">

      </div>

// === KPI strip (top of palmares) ===
function renderPalmaresKPIs(stats, cohort) {
  const compareLine = (myValue, cohortValue, suffix = '', invertGood = false) => {
    if (!cohort || cohort.n < 2) return '';
    const diff = myValue - cohortValue;
    const better = invertGood ? diff < 0 : diff > 0;
    const same = Math.abs(diff) < 0.5;
    const cls = same ? 'neutral' : (better ? 'better' : 'lower');
    const arrow = same ? '=' : (better ? '▲' : '▼');
    const formatted = Math.abs(diff) < 1 ? Math.abs(diff).toFixed(1) : Math.round(Math.abs(diff));
    return `<span class="kpi-compare ${cls}">${arrow} ${same ? 'moyenne' : `${formatted}${suffix} vs moyenne`}</span>`;
  };
  
  return `
    <div class="palmares-kpis">
      <div class="palmares-kpi">
        <div class="kpi-label">Étoiles cumulées</div>
        <div class="kpi-value-row">
          <span class="kpi-value">${stats.totalStars}<span class="kpi-total">/50</span></span>
          ${compareLine(stats.totalStars, cohort?.totalStars || 0)}
        </div>
      </div>
      <div class="palmares-kpi">
        <div class="kpi-label">Modules complétés</div>
        <div class="kpi-value-row">
          <span class="kpi-value">${stats.completed}<span class="kpi-total">/10</span></span>
          ${compareLine(stats.completed, cohort?.completedAvg || 0)}
        </div>
      </div>
      <div class="palmares-kpi">
        <div class="kpi-label">Quiz parfaits 1<sup>er</sup> coup</div>
        <div class="kpi-value-row">
          <span class="kpi-value">${stats.perfectFirstTry.length}</span>
          ${compareLine(stats.perfectFirstTry.length, cohort?.perfectFirstTryAvg || 0)}
        </div>
      </div>
      <div class="palmares-kpi">
        <div class="kpi-label">Temps investi</div>
        <div class="kpi-value-row">
          <span class="kpi-value-small">${formatDuration(stats.totalTimeMs)}</span>
          ${cohort && cohort.n >= 2 ? `<span class="kpi-compare neutral">moy. ${formatDuration(cohort.timeSpentAvgMs)}</span>` : ''}
        </div>
      </div>
    </div>
  `;
}

// === Stars curve (cumulative over time) ===
function renderStarsCurve(stats, cohort) {
  const W = 700, H = 220, padL = 50, padR = 24, padT = 24, padB = 40;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  
  // X axis: completion order (1..n) since dates may cluster
  // We'll plot on completion-event index for clearer spacing
  const points = stats.starsTimeline;
  const maxStars = 50;
  const maxX = Math.max(10, points.length); // at least 10 columns to leave room
  
  const xCoord = i => padL + (i / maxX) * innerW;
  const yCoord = v => padT + innerH - (v / maxStars) * innerH;
  
  // Build path
  let path = `M ${xCoord(0)} ${yCoord(0)}`;
  points.forEach((p, i) => {
    path += ` L ${xCoord(i + 1)} ${yCoord(p.stars)}`;
  });
  
  // Cohort average line (if available, projected linearly)
  let cohortPath = '';
  if (cohort && cohort.n >= 2 && points.length > 0) {
    const cohortAtN = (n) => Math.min(50, (cohort.totalStars / Math.max(1, cohort.completedAvg)) * n);
    const cohortPts = points.map((p, i) => `${xCoord(i + 1)},${yCoord(cohortAtN(i + 1))}`);
    cohortPath = `M ${xCoord(0)},${yCoord(0)} L ${cohortPts.join(' L ')}`;
  }
  
  // Y axis grid (0, 10, 20, 30, 40, 50)
  const yTicks = [0, 10, 20, 30, 40, 50];
  
  return `
    <div class="palmares-card">
      <div class="palmares-card-header">
        <h3>Étoiles cumulées dans le temps</h3>
        <div class="palmares-card-sub">${points.length} module${points.length > 1 ? 's' : ''} complété${points.length > 1 ? 's' : ''}</div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="Courbe étoiles cumulées">
        ${yTicks.map(t => `
          <line x1="${padL}" y1="${yCoord(t)}" x2="${W - padR}" y2="${yCoord(t)}" stroke="#E8EAEE" stroke-width="1" stroke-dasharray="${t === 0 || t === 50 ? '0' : '2 4'}"/>
          <text x="${padL - 10}" y="${yCoord(t) + 4}" text-anchor="end" font-size="11" fill="#8A8E96" font-family="Inter, sans-serif">${t}</text>
        `).join('')}
        
        ${cohortPath ? `
          <path d="${cohortPath}" stroke="#B0B5BD" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity="0.7"/>
        ` : ''}
        
        <path d="${path}" stroke="#B8960C" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
        
        ${points.map((p, i) => {
          const colorClass = COLOR_MAP[MODULES[p.code]?.color] || 'module-navy';
          const cx = xCoord(i + 1);
          const cy = yCoord(p.stars);
          return `
            <circle cx="${cx}" cy="${cy}" r="6" fill="white" stroke="#B8960C" stroke-width="2.5"/>
            <text x="${cx}" y="${cy - 14}" text-anchor="middle" font-size="10" font-weight="700" fill="#1B2A4A" font-family="Inter, sans-serif">${p.code}</text>
          `;
        }).join('')}
        
        <text x="${padL}" y="${H - 12}" font-size="11" fill="#8A8E96" font-family="Inter, sans-serif">Début</text>
        <text x="${W - padR}" y="${H - 12}" text-anchor="end" font-size="11" fill="#8A8E96" font-family="Inter, sans-serif">Maintenant</text>
      </svg>
      ${cohort && cohort.n >= 2 ? `
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-line gold"></span>Vous (${stats.totalStars}★)</span>
          <span class="legend-item"><span class="legend-line dashed"></span>Moyenne cohorte (${Math.round(cohort.totalStars)}★)</span>
        </div>
      ` : ''}
    </div>
  `;
}

// === Records & best module ===
function renderRecords(stats, cohort) {

  return `

async function loadLeaderboardFromSupabase(userTriggered = false) {
  const container = document.getElementById('leaderboard-container');
  if (!container) return;
  
  if (userTriggered) {
    container.innerHTML = '<div class="leaderboard-loading"><div class="lb-spinner"></div><p>Actualisation…</p></div>';
  }
  
  const sb = initSupabase();
  if (!sb) {
    container.innerHTML = `<div class="empty-state"><h3>Cloud indisponible</h3><p>Impossible de contacter le serveur Supabase.</p></div>`;
    return;
  }
  
  try {
    const { data, error } = await sb.rpc('get_leaderboard');
    if (error) throw error;
    
    container.innerHTML = renderLeaderboardTable(data || []);
  } catch (e) {
    console.error('Leaderboard load failed:', e);
    container.innerHTML = `
      <div class="empty-state">
        <h3>Erreur de chargement</h3>
        <p>${e.message || 'Le classement n\'a pas pu être récupéré.'}</p>
        <button class="btn btn-secondary" onclick="loadLeaderboardFromSupabase(true)" style="margin-top:14px;">↻ Réessayer</button>
      </div>
    `;
  }
}

function renderLeaderboardTable(entries) {
  if (!entries || entries.length === 0) {
    return `
      <div class="empty-state">
        <h3>Aucun participant à afficher</h3>
        <p>Aucune donnée n'est disponible pour le moment.</p>
      </div>
    `;
  }
  
  const myCode = getActiveUserCode();
  const myEntry = entries.find(e => e.participant_id === myCode);
  
  // Format last_activity
  const fmtDate = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    const now = new Date();
    const diff = now - d;
    const oneDay = 86400000;
    if (diff < oneDay) {
      return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) + ' aujourd\'hui';
    }
    if (diff < oneDay * 7) {
      const days = Math.floor(diff / oneDay);
      return `il y a ${days} jour${days > 1 ? 's' : ''}`;
    }
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
  };
  
  // Rank medal for top 3
  const rankBadge = (rank) => {
    if (rank === 1) return '<span class="rank-medal rank-gold">🥇</span>';
    if (rank === 2) return '<span class="rank-medal rank-silver">🥈</span>';
    if (rank === 3) return '<span class="rank-medal rank-bronze">🥉</span>';
    return `<span class="rank-num">${rank}</span>`;
  };
  
  // "Ma position" banner if user is logged in as participant
  const myPositionBanner = myEntry ? `
    <div class="my-position-banner">
      <div class="my-position-label">Votre position</div>
      <div class="my-position-rank">${myEntry.rank}<span class="my-position-total">/ ${entries.length}</span></div>
      <div class="my-position-stats">
        <span><strong>${myEntry.total_stars}</strong> ★</span>
        <span><strong>${myEntry.modules_completed}</strong> / 10 modules</span>
        ${myEntry.avg_quiz_score !== null ? `<span>Quiz moyen <strong>${Math.round(myEntry.avg_quiz_score * 100)}%</strong></span>` : ''}
      </div>
    </div>
  ` : '';
  
  return `
    ${myPositionBanner}
    
    <div class="leaderboard-table-v2">
      <div class="lb-row-v2 lb-header">
        <div class="lb-col-rank">Rang</div>
        <div class="lb-col-name">Participant</div>
        <div class="lb-col-score">Score</div>
        <div class="lb-col-modules">Modules</div>
        <div class="lb-col-date">Mise à jour</div>
      </div>
      
      ${entries.map(e => {
        const isMe = e.participant_id === myCode;
        const isTop3 = e.rank <= 3;
        return `
          <div class="lb-row-v2 ${isMe ? 'is-me' : ''} ${isTop3 ? 'is-top3' : ''} ${e.total_stars === 0 ? 'is-zero' : ''}">
            <div class="lb-col-rank">${rankBadge(e.rank)}</div>
            <div class="lb-col-name">
              <div class="lb-name-main">${e.full_name}${isMe ? ' <span class="me-badge">vous</span>' : ''}</div>
              ${e.fonction ? `<div class="lb-name-sub">${e.fonction}</div>` : ''}
            </div>
            <div class="lb-col-score">
              <div class="lb-score-main">${e.total_stars}<span class="lb-score-unit">★</span></div>
              ${e.avg_quiz_score !== null ? `<div class="lb-score-sub">${Math.round(e.avg_quiz_score * 100)}% quiz</div>` : ''}
            </div>
            <div class="lb-col-modules">
              <div class="lb-modules-main">${e.modules_completed}<span class="lb-modules-total">/10</span></div>
            </div>
            <div class="lb-col-date">${fmtDate(e.last_activity)}</div>
          </div>
        `;
      }).join('')}
    </div>
    
    <div class="leaderboard-footer-note">
      Classement calculé par : étoiles cumulées → modules complétés → score moyen quiz
    </div>
  `;
}

function exportJSON() {
  // Aggregated KPIs only - no individual qualitative content
  // Exclude FORMATEUR-TEST from real data
  const realData = Object.entries(state.data).filter(([k]) => k !== FORMATEUR.code).map(([_, v]) => v);
  
  const aggregate = {
    cohort: 'WARDA',
    program: 'TRIVIUM 50 jours',
    exportDate: new Date().toISOString(),
    participantCount: PARTICIPANTS.length,
    activeCount: realData.length,
    averageStars: 0,
    averageCompletion: 0,
    moduleStats: {}
  };
  
  const totalStars = realData.reduce((s, ud) => s + (ud.totalStars || 0), 0);
  const totalCompletion = realData.reduce((s, ud) => 
    s + Object.values(ud.sessions || {}).filter(x => x.state === 'completed').length, 0);
  
  aggregate.averageStars = aggregate.activeCount > 0 ? (totalStars / aggregate.activeCount).toFixed(2) : 0;
  aggregate.averageCompletion = aggregate.activeCount > 0 ? Math.round((totalCompletion / aggregate.activeCount / 10) * 100) : 0;
  
  Object.keys(MODULES).forEach(mc => {
    const completionRate = realData.filter(ud => ud.sessions?.[mc]?.state === 'completed').length;
    const scores = realData.map(ud => ud.sessions?.[mc]?.quizScore).filter(s => s !== null && s !== undefined);
    const avgScore = scores.length > 0 ? (scores.reduce((a,b) => a+b, 0) / scores.length) : null;
    aggregate.moduleStats[mc] = {
      title: MODULES[mc].title,
      session: MODULES[mc].session,
      completionCount: completionRate,
      averageQuizScore: avgScore !== null ? avgScore.toFixed(3) : null
    };
  });
  
  const blob = new Blob([JSON.stringify(aggregate, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `WARDA_KPI_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function exportAggregateCSV() {
  const lines = ['code,nom,fonction,modules_completes,etoiles,derniere_activite'];
  PARTICIPANTS.forEach(p => {
    const ud = state.data[p.code];
    const completed = ud ? Object.values(ud.sessions || {}).filter(s => s.state === 'completed').length : 0;
    const stars = ud?.totalStars || 0;
    const last = ud?.lastUpdated ? new Date(ud.lastUpdated).toISOString().slice(0, 10) : '';
    lines.push(`${p.code},"${p.name}","${p.fonction}",${completed},${stars},${last}`);
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `WARDA_progression_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

async function adminDeleteParticipant(code) {
  if (!confirm(`Supprimer définitivement le participant ${code} ?\n\nToutes ses réponses seront effacées du cloud.\n\nLe compte d'authentification doit être supprimé manuellement dans Supabase Dashboard → Authentication.`)) return;
  
  try {
    await supabaseDeleteParticipant(code);
    // Remove from local state too
    delete state.data[code];
    const idx = PARTICIPANTS.findIndex(p => p.code === code);
    if (idx !== -1) PARTICIPANTS.splice(idx, 1);
    
    saveAllData();
    navigateTo('admin');
    showInfo(`Participant ${code} supprimé. Pensez à supprimer son compte auth dans Supabase Dashboard.`);
  } catch (e) {
    showError('Suppression impossible : ' + (e.message || 'erreur cloud'));
  }
}

async function adminEditParticipant(code) {
  const participant = PARTICIPANTS.find(p => p.code === code);
  if (!participant) return;
  
  const newName = prompt(`Nom complet de ${code} :`, participant.name);
  if (newName === null) return;
  
  const newFonction = prompt(`Fonction de ${code} :`, participant.fonction || '');
  if (newFonction === null) return;
  
  try {
    await supabaseUpdateParticipant(code, { full_name: newName, fonction: newFonction });
    participant.name = newName;
    participant.fonction = newFonction;
    if (state.data[code]) {
      state.data[code].name = newName;
      state.data[code].fonction = newFonction;
    }
    saveAllData();
    renderApp();
    showInfo(`${code} mis à jour.`);
  } catch (e) {
    showError('Mise à jour impossible : ' + (e.message || 'erreur cloud'));
  }
}

function showInfo(msg) {
  const ov = document.getElementById('error-overlay');
  if (!ov) { alert(msg); return; }
  ov.style.background = '#1A6B6B';
  ov.innerHTML = msg + ' <button onclick="this.parentElement.classList.remove(\'show\')">×</button>';
  ov.classList.add('show');
  setTimeout(() => {
    ov.classList.remove('show');
    ov.style.background = '';
  }, 5000);
}

function adminExportParticipantPDF(code) {
  if (typeof window.jspdf === 'undefined' && typeof window.jsPDF === 'undefined') {
    showError('La bibliothèque PDF n\'est pas chargée. Vérifiez votre connexion internet.');
    return;
  }
  
  const ud = state.data[code];
  if (!ud) { showError('Aucune donnée pour ce participant.'); return; }
  
  const participant = PARTICIPANTS.find(p => p.code === code);
  const jsPDF = window.jspdf?.jsPDF || window.jsPDF;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  
  // Palette ÉCA
  const NAVY = [27, 42, 74];
  const NAVY_DEEP = [13, 26, 46];
  const GOLD = [184, 150, 12];
  const TEAL = [26, 107, 107];
  const TEXT = [42, 50, 64];
  const MUTE = [120, 124, 132];
  const BORDER = [220, 224, 230];
  
  const W = 210; // A4 width mm
  const H = 297; // A4 height mm
  const M = 18; // margin
  let y = M;
  
  // === COVER PAGE ===
  // Top band
  doc.setFillColor(...NAVY_DEEP);
  doc.rect(0, 0, W, 60, 'F');
  
  // Gold accent line
  doc.setFillColor(...GOLD);
  doc.rect(0, 60, W, 1.5, 'F');
  
  // Title
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text('OCTOGO ANCRAGE — COHORTE WARDA', M, 22);
  
  doc.setFontSize(26);
  doc.setFont('helvetica', 'bold');
  doc.text('Synthèse des réponses', M, 35);
  
  doc.setFontSize(12);
  doc.setFont('helvetica', 'italic');
  doc.setTextColor(255, 220, 140);
  doc.text(`${ud.name} — ${code}`, M, 45);
  
  doc.setFontSize(9);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(220, 220, 220);
  doc.text(`Exporté le ${formatDateLong(new Date().toISOString())} · TRIVIUM 50 jours`, M, 53);
  
  y = 75;
  
  // Identité
  doc.setTextColor(...TEXT);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text('IDENTITÉ', M, y);
  doc.setDrawColor(...GOLD);
  doc.setLineWidth(0.4);
  doc.line(M, y + 1.5, M + 30, y + 1.5);
  y += 7;
  
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(...TEXT);
  doc.text(`Nom : ${ud.name}`, M, y); y += 5;
  doc.text(`Identifiant : ${code}`, M, y); y += 5;
  if (ud.fonction) { doc.text(`Fonction : ${ud.fonction}`, M, y); y += 5; }
  doc.text(`Cohorte : WARDA`, M, y); y += 5;
  
  y += 6;
  
  // Synthèse stats
  const sessions = ud.sessions || {};
  const completed = Object.values(sessions).filter(s => s.state === 'completed').length;
  const inProgress = Object.values(sessions).filter(s => s.state === 'in_progress').length;
  const totalTimeMs = Object.values(sessions).reduce((sum, s) => sum + (s.timeSpentMs || 0), 0);
  const totalTimeH = Math.floor(totalTimeMs / 3600000);
  const totalTimeMin = Math.floor((totalTimeMs % 3600000) / 60000);
  
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.text('AVANCEMENT', M, y);
  doc.line(M, y + 1.5, M + 35, y + 1.5);
  y += 8;
  
  // Stat boxes
  const statBoxes = [
    { label: 'Modules complétés', value: `${completed} / 10` },
    { label: 'En cours', value: `${inProgress}` },
    { label: 'Étoiles cumulées', value: `${ud.totalStars || 0} / 50` },
    { label: 'Temps investi', value: `${totalTimeH}h ${totalTimeMin}min` }
  ];
  
  const boxW = (W - 2 * M - 9) / 4;
  statBoxes.forEach((s, i) => {
    const x = M + i * (boxW + 3);
    doc.setDrawColor(...BORDER);
    doc.setFillColor(250, 248, 240);
    doc.roundedRect(x, y, boxW, 18, 1.5, 1.5, 'FD');
    doc.setFontSize(7);
    doc.setTextColor(...MUTE);
    doc.setFont('helvetica', 'normal');
    doc.text(s.label.toUpperCase(), x + 3, y + 5);
    doc.setFontSize(13);
    doc.setTextColor(...NAVY);
    doc.setFont('helvetica', 'bold');
    doc.text(String(s.value), x + 3, y + 13);
  });
  y += 25;
  
  // Module summary table
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(...TEXT);
  doc.text('RÉCAPITULATIF PAR MODULE', M, y);
  doc.line(M, y + 1.5, M + 55, y + 1.5);
  y += 7;
  
  // Header row
  doc.setFillColor(...NAVY);
  doc.rect(M, y, W - 2 * M, 7, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(9);
  doc.setFont('helvetica', 'bold');
  doc.text('Module', M + 2, y + 4.7);
  doc.text('Statut', M + 70, y + 4.7);
  doc.text('Quiz', M + 105, y + 4.7);
  doc.text('Étoiles', M + 130, y + 4.7);
  doc.text('Rappels', M + 155, y + 4.7);
  y += 7;
  
  Object.entries(MODULES).forEach(([mc, m], idx) => {
    const s = sessions[mc] || createEmptySession();
    if (idx % 2 === 0) {
      doc.setFillColor(248, 248, 250);
      doc.rect(M, y, W - 2 * M, 6.5, 'F');
    }
    doc.setTextColor(...TEXT);
    doc.setFontSize(8.5);
    doc.setFont('helvetica', 'normal');
    doc.text(`${mc} — ${m.title.substring(0, 28)}`, M + 2, y + 4.5);
    const stateLabel = { 'not_started': '—', 'in_progress': 'En cours', 'completed': 'Complété' }[s.state];
    doc.text(stateLabel, M + 70, y + 4.5);
    doc.text(s.quizScore !== null && s.quizScore !== undefined ? Math.round(s.quizScore * 100) + '%' : '—', M + 105, y + 4.5);
    doc.text(`${s.stars || 0}/5`, M + 130, y + 4.5);
    const remDone = REMINDER_INTERVALS.filter(d => s.reminders?.[d]?.completed).length;
    const remTotal = REMINDER_INTERVALS.filter(d => s.reminders?.[d]?.dueDate).length;
    doc.text(remTotal > 0 ? `${remDone}/${remTotal}` : '—', M + 155, y + 4.5);
    y += 6.5;
  });
  
  // === DETAILED PAGES per completed/in_progress module ===
  Object.entries(MODULES).forEach(([mc, m]) => {
    const s = sessions[mc];
    if (!s || s.state === 'not_started') return;
    if (!s.imageComment && !s.casPratique && (!s.quizScore && s.quizScore !== 0)) return;
    
    doc.addPage();
    y = M;
    
    // Header band with module color (using navy/gold for simplicity)
    doc.setFillColor(...NAVY);
    doc.rect(0, 0, W, 28, 'F');
    doc.setFillColor(...GOLD);
    doc.rect(0, 28, W, 1, 'F');
    
    doc.setTextColor(...GOLD);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.text(`${mc} · ${SESSION_INFO[m.session].label.toUpperCase()}`, M, 12);
    
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(17);
    doc.setFont('helvetica', 'bold');
    doc.text(m.title, M, 22);
    
    y = 38;
    
    // Status line
    doc.setTextColor(...MUTE);
    doc.setFontSize(9);
    doc.setFont('helvetica', 'italic');
    const stLabel = s.state === 'completed' ? 'Complété' : 'En cours';
    const dateStr = s.completedAt ? formatDateLong(s.completedAt) : (s.startedAt ? `démarré ${formatDateLong(s.startedAt)}` : '');
    doc.text(`${stLabel}${dateStr ? ' · ' + dateStr : ''} · ${'★'.repeat(s.stars || 0)}${'☆'.repeat(5 - (s.stars || 0))} (${s.stars || 0}/5)`, M, y);
    y += 8;
    
    // Quiz score
    if (s.quizScore !== null && s.quizScore !== undefined) {
      doc.setFillColor(248, 244, 220);
      doc.roundedRect(M, y, W - 2 * M, 14, 1.5, 1.5, 'F');
      doc.setTextColor(...NAVY);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.text('SCORE QUIZ', M + 4, y + 5.5);
      doc.setFontSize(14);
      doc.text(`${Math.round(s.quizScore * 100)}%`, M + 4, y + 11);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(...MUTE);
      doc.text(s.quizFirstTry && s.quizScore === 1 ? 'Parfait au premier essai' : (s.quizFirstTry ? 'Premier essai' : 'Multiples essais'), M + 35, y + 8.5);
      y += 18;
    }
    
    // Image stimulus response
    if (s.imageComment && s.imageComment.trim()) {
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(...NAVY);
      doc.text('IMAGE-STIMULUS — réponse libre', M, y);
      doc.setDrawColor(...GOLD);
      doc.setLineWidth(0.3);
      doc.line(M, y + 1.5, M + 70, y + 1.5);
      y += 6;
      
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(...TEXT);
      const imgLines = doc.splitTextToSize(s.imageComment, W - 2 * M - 4);
      doc.setFillColor(252, 250, 245);
      const imgH = imgLines.length * 5 + 6;
      doc.rect(M, y, W - 2 * M, imgH, 'F');
      doc.text(imgLines, M + 2, y + 5);
      y += imgH + 6;
    }
    
    // Cas pratique response
    if (s.casPratique && s.casPratique.trim()) {
      // Check page break
      if (y > H - 70) { doc.addPage(); y = M; }
      
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(...NAVY);
      doc.text('CAS PRATIQUE — plan d\'action', M, y);
      doc.setDrawColor(...GOLD);
      doc.line(M, y + 1.5, M + 60, y + 1.5);
      y += 6;
      
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.setTextColor(...TEXT);
      const casLines = doc.splitTextToSize(s.casPratique, W - 2 * M - 4);
      doc.setFillColor(252, 250, 245);
      const casH = casLines.length * 5 + 6;
      doc.rect(M, y, W - 2 * M, casH, 'F');
      doc.text(casLines, M + 2, y + 5);
      y += casH + 6;
    }
    
    // Quiz detailed answers
    if (s.quizAnswers && Object.keys(s.quizAnswers).length > 0) {
      if (y > H - 50) { doc.addPage(); y = M; }
      
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(...NAVY);
      doc.text('DÉTAIL DU QUIZ', M, y);
      doc.line(M, y + 1.5, M + 35, y + 1.5);
      y += 7;
      
      doc.setFontSize(8.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...TEXT);
      
      (m.questions || []).forEach((q, qi) => {
        const userAnsIdx = s.quizAnswers[qi];
        if (userAnsIdx === undefined) return;
        
        if (y > H - 30) { doc.addPage(); y = M; }
        
        const correct = userAnsIdx === q.correct;
        const symbol = correct ? '✓' : '✗';
        
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(correct ? 46 : 199, correct ? 122 : 61, correct ? 74 : 61);
        doc.text(`${symbol} Q${qi + 1}`, M, y);
        
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(...TEXT);
        const qLines = doc.splitTextToSize(q.q || '', W - 2 * M - 14);
        doc.text(qLines, M + 12, y);
        y += qLines.length * 4 + 1;
        
        doc.setFontSize(8);
        doc.setTextColor(...MUTE);
        doc.text(`Réponse donnée : ${q.options?.[userAnsIdx] || '—'}`, M + 12, y);
        y += 4;
        if (!correct) {
          doc.text(`Bonne réponse : ${q.options?.[q.correct] || '—'}`, M + 12, y);
          y += 4;
        }
        y += 2;
        doc.setFontSize(8.5);
      });
    }
  });
  
  // === FOOTER on every page ===
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(...MUTE);
    doc.setFont('helvetica', 'normal');
    doc.text('OCTOGO Formation & Conseil · ÉCA (École de la Cohérence Adaptative)', M, H - 8);
    doc.text(`${i} / ${pageCount}`, W - M, H - 8, { align: 'right' });
  }
  
  // Save
  const safeName = (ud.name || code).replace(/[^a-zA-Z0-9-]/g, '_');
  doc.save(`OCTOGO_WARDA_${code}_${safeName}.pdf`);
  showInfo(`PDF généré pour ${ud.name}`);
}


// =============================================================
// NAVIGATION
// =============================================================

function navigateTo(view) {
  // If leaving a module view, accumulate time first
  if (state.currentView === 'module') {
    accumulateModuleTime();
    saveAllData();
  }
  state.currentView = view;
  state.currentModule = null;
  state.currentStep = 0;
  state.adminViewing = null;
  state.reminderQuiz = null;
  document.getElementById('sidebar')?.classList.remove('open');
  renderApp();
  scrollToTopOfContent();
}

function toggleSidebar() {
  document.getElementById('sidebar')?.classList.toggle('open');
}

// =============================================================
// BOOT
// =============================================================

async function init() {
  state.data = loadAllData();
  
  // Migration: ensure new modules exist for existing users
  Object.keys(state.data).forEach(code => {
    Object.keys(MODULES).forEach(mc => {
      if (!state.data[code].sessions) state.data[code].sessions = {};
      if (!state.data[code].sessions[mc]) {
        state.data[code].sessions[mc] = createEmptySession();
      }
    });
  });
  
  // Try to restore Supabase session (auto-login if token still valid)
  try {
    initSupabase();
    const sess = await supabaseGetCurrentSession();
    if (sess) {
      if (sess.isAdmin) {
        await supabaseLoadAllParticipantsData();
        ensureUserData(FORMATEUR.code);
        state.currentUser = { type: 'admin', code: FORMATEUR.code, name: sess.adminName };
        state.currentView = 'admin';
        saveAllData();
        renderApp();
        return;
       } else if (sess.participant) {
        await supabaseLoadParticipantData(sess.participant.participant_id);
        await syncFirstLoginAndGlobalReminders(sess.participant.participant_id); // NEW
        state.currentUser = { type: 'participant', code: sess.participant.participant_id, name: sess.participant.full_name };
        state.currentView = 'dashboard';
        saveAllData();
        renderApp();
        setTimeout(showGlobalReminderAlert, 350); // NEW — modale auto si rappels dus
        return;
      }
    }
  } catch (e) {
    console.warn('Auto-restore session failed:', e);
  }
  
  renderProfileSelector();
}

// Wait for DOM
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
