ression individuelle se renforce par des passages à l'acte délibérés. Quatre leviers à pratiquer cette semaine.\n\n**Levier 1 — Nommer dans l'instant ce que vous ressentez**. En réunion, au lieu de garder pour vous ce que vous percevez, dire en une phrase : « je suis inquiet de ce point », « je trouve cette idée très juste », « je ne suis pas convaincu et voici pourquoi ». Pas un discours — une phrase. Le but n'est pas de tout exprimer, c'est de ne plus systématiquement tout retenir.\n\n**Levier 2 — Dire un « non » court par jour, sans justification longue**. À une demande hors périmètre, hors capacité, ou simplement hors priorité, répondre : « Non, je ne pourrai pas faire cela. » Sans excuse en cascade, sans long argumentaire. La justification longue trahit l'absence d'affirmation. Le « non » net **est** l'affirmation.\n\n**Levier 3 — Tenir une position minoritaire sur un sujet par semaine**. Identifier un sujet où votre lecture diverge du consensus. Formuler clairement votre position, l'argumenter une fois, et **ne pas la modifier sous la seule pression du nombre**. Si on vous fait changer d'avis, que ce soit par un argument — jamais par la fatigue de la dissension.\n\n**Levier 4 — Le rituel de la voix vraie avant les prises de parole importantes**. Avant une intervention à enjeu : main sur le sternum, cohérence cardiaque sur 1 minute (Module 5), rappel mental de la valeur en jeu. Vous parlez ensuite **depuis** cette valeur, pas seulement **à propos** d'elle. La différence est physiologiquement perceptible — par vous, et par votre auditoire.","citation":"*« La clarté intérieure crée la clarté extérieure. »* — ÉCA (École de la Cohérence Adaptative)"}],"questions":[{"num":1,"text":"Selon Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, 2011), l'expression individuelle est :","options":["La capacité à comprendre les émotions des autres","La capacité à exprimer ses sentiments, pensées et convictions, et à tenir une position autonome","La capacité à parler en public avec assurance","La capacité à séduire son auditoire"],"correct":1,"explanation":"L'expression individuelle (Self-Expression) est le second composite du modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0). Elle ne se réduit pas à l'éloquence ou à la prise de parole publique — elle inclut l'expression émotionnelle, l'affirmation de ses positions, et l'autonomie face à la pression sociale."},{"num":2,"text":"Les trois composantes de l'expression individuelle sont :","options":["Expression émotionnelle, Affirmation de soi, Indépendance","Charisme, conviction, séduction","Optimisme, énergie, vitalité","Écoute, empathie, ouverture"],"correct":0,"explanation":"Bar-On (2011) décompose Self-Expression en trois sous-échelles : Expression émotionnelle (Emotional Expression — dire ce qu'on ressent), Affirmation de soi (Assertiveness — défendre ses positions sans agressivité), Indépendance (Independence — autonomie face à l'approbation sociale)."},{"num":3,"text":"L'affirmation de soi se distingue de l'agressivité en ce qu'elle :","options":["Se manifeste plus discrètement","Défend une position sans dévaloriser l'autre, ni s'excuser d'exister","Évite les sujets de désaccord","Repose sur la séduction plutôt que la confrontation"],"correct":1,"explanation":"L'affirmation occupe le terrain étroit entre passivité et agressivité. Elle dit clairement « voici ma position » sans attaquer la personne d'en face. Le « non » assertif est court, factuel, sans justification excessive (qui trahit la culpabilité) ni hostilité (qui trahit l'angoisse)."},{"num":4,"text":"L'asymétrie frontale gauche, étudiée par Richard Davidson, est associée à :","options":["La rumination négative","La rigidité cognitive","La motivation d'approche, l'engagement et l'expression positive","Le retrait social"],"correct":2,"explanation":"Davidson a documenté depuis les années 1990 que l'activation dominante du cortex préfrontal gauche corrèle avec les affects positifs et la disposition à l'approche — initiative, expression, engagement. L'asymétrie inverse (frontal droit dominant) est associée au retrait, à l'évitement et à l'inhibition."},{"num":5,"text":"Selon le modèle Bar-On, l'indépendance signifie :","options":["Travailler seul, sans collaboration","Ignorer les opinions des autres","Penser et agir de façon autonome, sans dépendance excessive à l'approbation","Refuser systématiquement les compromis"],"correct":2,"explanation":"L'indépendance n'est pas l'isolement — c'est la capacité à tenir une position que l'on sait juste face à la pression sociale, à tolérer le désaccord, à ne pas avoir besoin que tout le monde valide chaque décision. Un leader sans cette composante devient le reflet du dernier qui a parlé."},{"num":6,"text":"Selon l'échelle ÉVEIL, le niveau « Mesuré » correspond à :","options":["Ne pas exprimer du tout","S'exprimer uniquement sur le factuel","Exprimer de façon contrôlée mais sans incarnation","Tenir sa position face au groupe"],"correct":2,"explanation":"Le niveau 3 « Mesuré » désigne celui qui dit les bonnes choses mais dont le corps ne suit pas — la voix dit, la posture nie, l'auditoire le sent. Le niveau 1 « Éteint » n'exprime rien. Le niveau 2 « Réservé » s'en tient au factuel. Le niveau 4 « Affirmé » incarne et tient sa position."},{"num":7,"text":"Le cortisol chronique a pour effet sur l'expression individuelle de :","options":["L'amplifier en stimulant la prise de parole","L'inhiber en diminuant l'activité de l'aire de Broca et du CPFG (Cortex Préfrontal Gauche)","La rendre plus émotionnelle","Améliorer la clarté du discours"],"correct":1,"explanation":"Le cortisol chronique réduit l'activité du cortex préfrontal gauche (associé à la motivation d'approche) et de l'aire de Broca (qui traduit l'intention en parole). Concrètement : sous stress prolongé, vous parlez moins, parlez moins juste, et avez plus de mal à dire ce que vous pensez. Ce n'est pas un manque de courage — c'est un effet biologique mesurable."},{"num":8,"text":"Avant une prise de parole importante, le rituel le plus efficace pour activer l'expression authentique est :","options":["Préparer un texte mot à mot et le réciter mentalement","Se concentrer sur l'auditoire en oubliant ses propres ressentis","Cohérence cardiaque + main sur le sternum + rappel de la valeur en jeu","Boire un café fort pour augmenter la vigilance"],"correct":2,"explanation":"Préparer un texte verrouille le niveau « Mesuré ». Se déconnecter de ses ressentis désincarne. La caféine augmente l'activation sans améliorer la justesse. La séquence cohérence cardiaque + ancrage corporel + rappel de la valeur active simultanément le nerf vague ventral (présence sociale, prosodie) et le CPFG (Cortex Préfrontal Gauche, motivation d'approche). Vous parlez **depuis** la valeur, pas **à propos** d'elle."}],"imageStimulus":{"description":"Une réunion de comité de direction. Sept personnes autour d'une table. Six parlent ou s'apprêtent à parler. Une seule, à droite, garde le silence — épaules légèrement rentrées, regard sur ses notes, mains croisées sur la table. On repère sur son visage qu'elle a quelque chose à dire mais ne le dira pas.","consigne":"Cette personne est à un niveau bas de l'échelle d'expression individuelle dans ce contexte précis. **Quelle composante est en déficit selon toi** : expression émotionnelle, affirmation de soi, ou indépendance ? Et **quelle phrase intérieure** la maintient muette (« ce n'est pas le moment », « ils ne vont pas comprendre », « je ne suis pas légitime », autre) ? Si tu te reconnais dans cette posture sur certains sujets, **lesquels** ?","imageFile":"6.jpeg"},"casPratique":{"title":"Mise en pratique — Sept jours de voix vraie","scenario":"Pendant les **7 prochains jours**, pratique trois micro-exercices, un par jour minimum.\n\n1. **Un nommage par jour** (Expression émotionnelle) — en réunion ou en entretien, dire en une phrase ce que tu ressens : « je suis inquiet de ce point », « je trouve cette idée très juste », « je ne suis pas convaincu ». Pas un discours — une phrase.\n\n2. **Un « non » court par jour** (Affirmation de soi) — à une demande hors périmètre ou hors priorité, répondre « Non, je ne pourrai pas faire cela » sans justification longue. Note ce que tu ressens dans le corps juste après.\n\n3. **Une position tenue dans la semaine** (Indépendance) — identifie un sujet où ta lecture diverge du consensus de ton équipe. Formule-la clairement, argumente une fois, et **ne change pas d'avis sous la simple pression du nombre**.\n\nÀ la fin de chaque jour, note : (1) lequel des trois exercices tu as fait, (2) ce que tu as ressenti dans le corps avant et après, (3) la phrase intérieure qui essayait de t'en empêcher.","ouverture":"Au bout de 7 jours, tu identifieras laquelle des trois composantes est ton point fort, laquelle est ton point d'évitement systématique, et quelle phrase intérieure verrouille le plus souvent ta voix. Ce repérage est le matériau direct du Module 7 (Relations humaines) — où l'expression rencontre l'autre."},"session":"RESET"},"M7":{"code":"M7","title":"RELATIONS HUMAINES","subtitle":"Reconnaître l'autre — empathie, lien, responsabilité","color":"olive","duration":"20 minutes","ecrans":[{"num":1,"title":"Pourquoi le lien précède le résultat","subtitle":"Le troisième axe du modèle Bar-On — l'intelligence interpersonnelle","body":"Après la perception de soi (Module 4) et l'expression individuelle (Module 6), le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, Bar-On 2011) place les **relations humaines** comme troisième composite. La logique est claire : il faut savoir se lire et oser dire avant de pouvoir vraiment reconnaître l'autre.\n\nLes relations humaines se définissent comme la capacité à comprendre les émotions des autres, à créer et entretenir des relations de confiance, et à agir de façon responsable pour le bien collectif. C'est l'**intelligence interpersonnelle**.\n\nLe verbe leader de cet axe est : **« Reconnaître l'autre »**.\n\nLa question-clé qu'un leader formé à ce modèle se pose : **« Est-ce que je comprends vraiment ce que l'autre ressent, ou est-ce que je projette ma propre lecture ? »**\n\nTrois conséquences pour le leadership :\n\n- **Sans empathie, vos décisions tombent à côté**. Vous traitez des indicateurs, pas des humains. Les meilleures stratégies échouent à l'exécution si elles n'intègrent pas la lecture émotionnelle des équipes.\n- **Sans relations de qualité, l'engagement décroche**. Les gens performent durablement pour des chefs qu'ils respectent, pas pour des fonctions qui leur signent leur paye.\n- **Sans responsabilité sociale, la confiance s'érode**. Un leader qui ne défend pas le bien collectif quand c'est coûteux ne tient pas à long terme.","citation":"*« Le lien précède le résultat. Toujours. »* — OCTOGO"},{"num":2,"title":"Les trois composantes des relations humaines","subtitle":"Relations humaines, Empathie, Responsabilité sociale","body":"Bar-On (2011) décompose ce composite en trois sous-échelles distinctes mais inséparables.\n\n**1. Relations humaines (Interpersonal Relationships)** — La capacité à établir et maintenir des **liens mutuellement satisfaisants**. Ce n'est pas le networking professionnel — c'est la qualité des relations effectives. Concrètement : combien de personnes dans votre environnement professionnel se sentent vues, respectées, et en sécurité psychologique avec vous ?\n\n**2. Empathie (Empathy)** — La capacité à reconnaître et comprendre les émotions d'autrui. Trois niveaux à distinguer : *l'empathie cognitive* (je comprends ce qu'il ressent, sans le ressentir moi-même), *l'empathie affective* (je ressens ce qu'il ressent), et *la compassion* (je ressens et je veux agir pour soulager). Un leader a besoin des trois — mais surtout de pouvoir choisir laquelle activer selon le contexte.\n\n**3. Responsabilité sociale (Social Responsibility)** — La capacité à contribuer au bien-être du groupe et à agir de façon éthique. C'est le passage de l'empathie individuelle à l'engagement collectif : ce que je fais pour mon équipe, mon organisation, ma société, au-delà de mon intérêt direct. Sans cette dimension, l'empathie devient instrument de séduction ou de manipulation.\n\n**Articulation** : les trois forment un système. Empathie sans relations = compréhension distante sans engagement. Relations sans responsabilité = networking transactionnel. Responsabilité sans empathie = bureaucratie morale, règle sans humanité. Les trois ensemble = leadership qui tient.","citation":""},{"num":3,"title":"Le substrat neuroanatomique","subtitle":"Le réseau de la cognition sociale","body":"Reconnaître l'autre n'est pas une qualité morale — c'est l'activation d'un réseau cérébral spécifique, le **réseau de la cognition sociale**.\n\n**Régions cérébrales impliquées** :\n\n- **Neurones miroirs** (cortex prémoteur, lobule pariétal inférieur) : découverts par l'équipe de Giacomo Rizzolatti à Parme dans les années 1990 (*Premotor cortex and the recognition of motor actions*, Rizzolatti, Fadiga, Gallese & Fogassi, 1996, *Cognitive Brain Research*). Ces neurones s'activent à la fois quand on accomplit une action et quand on observe quelqu'un d'autre l'accomplir. C'est la base biologique de l'empathie : votre cerveau simule en interne ce que vit l'autre.\n- **Insula antérieure** : permet de **ressentir** dans son propre corps l'émotion de l'autre. La même région qui sert à votre interoception (Module 4) sert à la résonance avec autrui.\n- **CPFm (Cortex Préfrontal Médian)** : siège de la *théorie de l'esprit* — comprendre que l'autre a des intentions, des croyances et des états mentaux différents des vôtres. C'est ce qui distingue l'empathie humaine adulte de la simple résonance émotionnelle.\n- **JTP (Jonction Temporo-Pariétale)** : distingue le **soi de l'autre**. Sans elle, l'empathie devient confusion (« je ressens ta peur, donc j'ai peur »). Avec elle, vous gardez la lucidité nécessaire pour aider sans vous noyer.\n\n**Biochimie associée** :\n- **Ocytocine** : hormone du lien et de la confiance. Libérée lors des contacts sociaux positifs, elle renforce la cohésion. Un leader qui prend soin de la qualité relationnelle de son équipe stimule littéralement la production d'ocytocine — collective.\n- **Vasopressine** : impliquée dans les comportements de protection et la fidélité au groupe.\n- **Cortisol** (en excès) : **réduit l'empathie**. Les études de Naomi Eisenberger (UCLA) ont montré que l'isolement social et le stress chronique activent les mêmes circuits que la douleur physique (cortex cingulaire antérieur dorsal) tout en émoussant la capacité d'empathie. Un leader stressé devient progressivement moins empathique — ce n'est pas un défaut moral, c'est une bascule biologique.\n\n**Implication** : l'empathie se cultive comme un muscle. Plus vous pratiquez l'écoute fine, plus le réseau se renforce (effet de plasticité, Module 3).","citation":"*« Nous sommes des êtres profondément sociaux, et notre cerveau est conçu pour comprendre l'autre de l'intérieur. »* — D'après Giacomo Rizzolatti, *Les neurones miroirs* (Rizzolatti & Sinigaglia, 2008)"},{"num":4,"title":"Où en êtes-vous ? L'échelle de maîtrise","subtitle":"Cinq niveaux observables — de l'égocentrage à l'inspiration","body":"Le modèle ÉVEIL distingue cinq niveaux comportementaux observables.\n\n**Niveau 1 — Égocentré**. Ne perçoit pas les émotions des autres. Impose son point de vue. Considère l'équipe comme une ressource d'exécution. *Impact* : équipe démotivée, turnover élevé, climat tendu.\n\n**Niveau 2 — Perceptif**. Repère les émotions visibles (colère, tristesse manifeste) mais ne sait pas y répondre. Attend que ça passe. *Impact* : relations superficielles, problèmes relationnels qui s'enkystent.\n\n**Niveau 3 — Empathique**. Comprend les émotions d'autrui et adapte son comportement. Peut accuser réception de ce que l'autre ressent. *Impact* : confiance de l'équipe, communication fluide, capacité à désamorcer.\n\n**Niveau 4 — Fédérateur**. Crée activement des liens de confiance. Anticipe les tensions relationnelles avant qu'elles n'explosent. Fait grandir les talents. *Impact* : équipe soudée, coopération naturelle, performance collective.\n\n**Niveau 5 — Inspirant**. Élève les autres par sa simple présence. Les collaborateurs se sentent vus, compris, valorisés — sans même qu'il ait à le formuler. *Impact* : leadership transformationnel, performance durable, transmission.\n\nComme pour les autres axes, **vous n'êtes pas à un niveau fixe**. Probablement Niveau 4 avec votre équipe directe, Niveau 2 avec les fonctions support que vous trouvez « pénibles », Niveau 1 sous stress avec un collaborateur dont les besoins ne correspondent pas à votre logique.","citation":""},{"num":5,"title":"Application leadership : les quatre niveaux d'écoute sur 7 jours","subtitle":"Apprendre à écouter au-delà des mots","body":"Le développement des relations humaines passe par la qualité de l'écoute. Quatre niveaux à distinguer et à pratiquer.\n\n**Niveau 1 — Écoute factuelle**. Vous entendez ce qui est dit, vous repérez les informations, les chiffres, les engagements. C'est la base, mais beaucoup de managers s'y arrêtent.\n\n**Niveau 2 — Écoute émotionnelle**. Vous percevez l'émotion qui accompagne les mots — ce que la voix, le rythme, le visage signalent. Quand un collaborateur dit « ça va aller » avec les épaules tombantes, le niveau 1 entend l'engagement, le niveau 2 entend la fatigue.\n\n**Niveau 3 — Écoute intentionnelle**. Vous entendez le **besoin sous-jacent**. Une demande de moyens supplémentaires peut signaler un besoin de reconnaissance ; une critique du processus peut signaler un besoin de sens ; un retrait soudain peut signaler un besoin de sécurité. Le mot dit une chose, le besoin parle d'une autre.\n\n**Niveau 4 — Écoute systémique**. Vous percevez ce que la prise de parole **fait dans le groupe** — qui parle au nom de qui, qui ne parle plus depuis quand, quelle dynamique se rejoue. C'est l'écoute du leader qui anime, pas seulement du leader qui répond.","citation":"*« Est-ce que je comprends vraiment ce que l'autre ressent, ou est-ce que je projette ma propre lecture ? »* — Question-clé du leader, modèle ÉVEIL"}],"questions":[{"num":1,"text":"Selon Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, 2011), les relations humaines sont :","options":["La capacité à parler en public efficacement","La capacité à comprendre les émotions des autres, à créer des liens de confiance et à agir pour le bien collectif","La capacité à imposer son leadership","La capacité à manager des équipes nombreuses"],"correct":1,"explanation":"Les relations humaines (Interpersonal) sont le troisième composite du modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0) — l'intelligence interpersonnelle. Elles englobent trois sous-échelles : empathie, qualité des relations effectives, et responsabilité sociale (engagement au-delà de l'intérêt personnel direct)."},{"num":2,"text":"Les trois composantes des relations humaines sont :","options":["Relations humaines, Empathie, Responsabilité sociale","Charisme, Influence, Vision","Écoute, Communication, Persuasion","Gestion du temps, Délégation, Reporting"],"correct":0,"explanation":"Bar-On (2011) décompose ce composite en : Relations humaines (Interpersonal Relationships, qualité des liens effectifs), Empathie (Empathy, comprendre l'émotion d'autrui), Responsabilité sociale (Social Responsibility, engagement collectif éthique)."},{"num":3,"text":"Les neurones miroirs, découverts par l'équipe de Giacomo Rizzolatti, s'activent :","options":["Uniquement lors d'une action propre","Uniquement lors de l'observation d'une action","À la fois lors d'une action propre et de l'observation de cette action chez autrui","Uniquement lors d'un raisonnement abstrait"],"correct":2,"explanation":"L'équipe de Rizzolatti à Parme (1996, *Cognitive Brain Research*) a découvert chez le macaque, puis confirmé chez l'humain, que certains neurones du cortex prémoteur s'activent à la fois quand on accomplit une action et quand on observe quelqu'un l'accomplir. C'est la base biologique de la simulation interne — fondement de l'empathie."},{"num":4,"text":"La JTP (Jonction Temporo-Pariétale) joue un rôle clé en :","options":["Mémorisant les visages","Régulant la respiration","Distinguant le soi de l'autre, évitant la confusion empathique","Stockant les souvenirs émotionnels"],"correct":2,"explanation":"La JTP (Jonction Temporo-Pariétale) permet de différencier ce qui m'appartient de ce qui appartient à l'autre. Sans elle, l'empathie devient contagion (« je ressens ta peur, donc j'ai peur »). Avec elle, vous pouvez ressentir ce que l'autre vit tout en gardant la lucidité nécessaire pour l'aider — c'est ce qui distingue l'empathie clinique de l'effondrement empathique."},{"num":5,"text":"L'ocytocine joue dans les relations humaines un rôle de :","options":["Stimulant cognitif","Hormone du lien et de la confiance, libérée par les contacts sociaux positifs","Régulateur du sommeil","Réducteur de la motivation"],"correct":1,"explanation":"L'ocytocine est centrale dans l'attachement, la confiance interpersonnelle, et le sentiment d'appartenance au groupe. Un leader qui investit dans la qualité relationnelle de son équipe stimule littéralement la production d'ocytocine — l'effet est mesurable et collectif."},{"num":6,"text":"Le cortisol chronique a pour effet sur l'empathie de :","options":["L'augmenter en aiguisant la perception","La réduire et favoriser des réactions défensives","La rendre plus stable","La concentrer sur les proches"],"correct":1,"explanation":"Sous stress chronique, l'empathie diminue mécaniquement — pas par défaut moral. Les travaux de Naomi Eisenberger (UCLA) montrent que l'isolement social et le stress prolongé altèrent les circuits de la cognition sociale tout en activant ceux de la douleur. Un leader stressé devient progressivement moins empathique. Régler son propre stress (Module 9) est un préalable au leadership empathique."},{"num":7,"text":"Selon l'échelle ÉVEIL, le niveau « Fédérateur » correspond à :","options":["Repérer les émotions visibles sans y répondre","Comprendre et adapter son comportement","Créer activement des liens de confiance et anticiper les tensions","Élever les autres par sa simple présence"],"correct":2,"explanation":"Le niveau 4 « Fédérateur » va au-delà de l'empathie réactive (niveau 3). Le leader fédérateur travaille **activement** la qualité relationnelle de son équipe, anticipe les tensions avant qu'elles n'explosent, fait grandir les talents. Le niveau 5 « Inspirant » va plus loin encore : présence transformatrice sans effort apparent."},{"num":8,"text":"L'écoute au niveau « intentionnel » consiste à :","options":["Reformuler les faits exposés","Repérer l'émotion manifeste","Identifier le besoin sous-jacent à ce qui est dit","Anticiper la réponse à donner"],"correct":2,"explanation":"L'écoute intentionnelle (niveau 3 sur 4) entend le besoin derrière le mot. Une demande de moyens peut signaler un besoin de reconnaissance ; une critique du processus, un besoin de sens ; un retrait soudain, un besoin de sécurité. Reformuler les faits = niveau 1. Repérer l'émotion = niveau 2. Identifier le besoin = niveau 3. Lire la dynamique de groupe = niveau 4."}],"imageStimulus":{"description":"Un entretien individuel dans un bureau. Un manager à droite, une collaboratrice à gauche. Le manager regarde son écran, prend des notes, ne lève pas les yeux. La collaboratrice parle, mais ses épaules sont rentrées, sa voix est probablement basse — son visage exprime quelque chose qu'elle ne dit pas avec les mots. Sur la table entre eux, un document avec des chiffres entourés.","consigne":"À quel **niveau d'écoute** est ce manager dans cette scène (factuelle, émotionnelle, intentionnelle, systémique) ? Que **manque-t-il** à cette interaction pour qu'elle soit utile ? Si tu étais à la place du manager, **quelle question** ouvrirais-tu pour passer au niveau supérieur ?","imageFile":"7.jpeg"},"casPratique":{"title":"Mise en pratique — Sept jours d'écoute multi-niveau","scenario":"Pendant les **7 prochains jours**, choisis chaque jour **une conversation à enjeu** (entretien individuel, réunion d'équipe, échange tendu, conversation difficile). Pendant cette conversation, fais consciemment le va-et-vient entre les quatre niveaux d'écoute :\n\n1. **Niveau factuel** — qu'est-ce qui est dit ?\n2. **Niveau émotionnel** — qu'est-ce qui est ressenti ?\n3. **Niveau intentionnel** — quel besoin parle derrière les mots ?\n4. **Niveau systémique** — qu'est-ce que ça fait dans le groupe / dans la relation ?\n\nÀ la fin de chaque conversation, note rapidement : à quel niveau ai-je passé le plus de temps ? À quel niveau **n'ai-je pas pensé aller** ? Qu'est-ce que j'ai raté en ne descendant pas plus bas ?","ouverture":"Au bout de 7 jours, tu identifieras ton niveau d'écoute dominant et ton niveau d'angle mort. Le travail des semaines suivantes consiste à **ouvrir progressivement** vers les niveaux que tu négliges. C'est ce qui transforme un manager qui répond en un leader qui reconnaît."},"session":"RESET"},"M8":{"code":"M8","title":"PRISE DE DÉCISION","subtitle":"Décider lucide — voir les faits, contrôler l'impulsion, choisir la solution","color":"forest green","duration":"20 minutes","ecrans":[{"num":1,"title":"Pourquoi décider est plus difficile qu'il n'y paraît","subtitle":"Le quatrième axe du modèle Bar-On — l'intelligence décisionnelle","body":"Après la perception de soi (Module 4), l'expression individuelle (Module 6) et les relations humaines (Module 7), le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, Bar-On 2011) place la **prise de décision** comme quatrième composite. La logique est claire : on ne décide bien qu'à partir d'une lecture juste de soi, des autres et du réel.\n\nLa prise de décision se définit comme la capacité à évaluer objectivement une situation, à générer des solutions et à prendre des décisions efficaces malgré l'incertitude.\n\nLe verbe leader de cet axe est : **« Décider lucide »**.\n\nLa question-clé qu'un leader formé à ce modèle se pose : **« Est-ce que je décide sur la base de faits, ou sur la base de ce que mon cerveau a prédit ? »**\n\nTrois conséquences pour le leadership :\n\n- **Décider sur prédictions silencieuses**. Le cerveau anticipe en permanence (Module 1) et ces anticipations colorent les « faits » que vous croyez voir. Sans vérification active, vous décidez sur votre représentation, pas sur la situation.\n- **Réagir au lieu de décider**. Sous pression, l'amygdale prend le devant et coupe partiellement le cortex préfrontal. Vous croyez décider — vous réagissez.\n- **Confondre vitesse et qualité**. Une décision rapide n'est pas forcément bonne ; une décision lente n'est pas forcément réfléchie. Ce qui compte, c'est l'**adéquation** du temps de décision au type de problème.","citation":"*« Est-ce que je décide sur la base de faits, ou sur la base de ce que mon cerveau a prédit ? »* — Question-clé du leader, modèle ÉVEIL"},{"num":2,"title":"Les trois composantes de la prise de décision","subtitle":"Résolution de problèmes, Sens de la réalité, Contrôle des impulsions","body":"Bar-On (2011) décompose la prise de décision en trois sous-échelles distinctes mais articulées.\n\n**1. Résolution de problèmes (Problem Solving)** — La capacité à identifier un problème, à **générer plusieurs solutions** possibles, et à évaluer leur efficacité avant de choisir. L'erreur fréquente : prendre la première solution venue parce qu'elle paraît évidente. Le réflexe de leader formé : ne jamais s'arrêter à une seule option avant d'en avoir formulé au moins deux ou trois.\n\n**2. Sens de la réalité (Reality Testing)** — La capacité à percevoir les choses **telles qu'elles sont**, sans les déformer par des biais, des attentes ou des prédictions personnelles. C'est l'écart entre la situation et votre lecture de la situation. Plus cet écart est faible, plus vos décisions touchent juste. C'est aussi la capacité de demander : « est-ce que ce que je crois est vérifié, ou seulement supposé ? »\n\n**3. Contrôle des impulsions (Impulse Control)** — La capacité à **retenir ou retarder une réaction immédiate** pour choisir une réponse plus adaptée. Ce n'est pas la suppression de l'impulsion (impossible) — c'est la création d'un **espace** entre stimulus et réponse. Cet espace est minuscule en temps physiologique (quelques secondes), mais c'est lui qui distingue une réaction d'une décision.\n\n**Articulation** : les trois forment un système. Sans contrôle des impulsions, le sens de la réalité n'a pas le temps d'opérer (vous réagissez avant d'avoir vu). Sans sens de la réalité, la résolution de problèmes travaille sur des données fausses (vous résolvez le mauvais problème). Sans résolution de problèmes, le contrôle des impulsions devient simple inhibition (vous attendez sans construire de réponse).","citation":""},{"num":3,"title":"Le substrat neuroanatomique : la cascade d'une seconde","subtitle":"Six structures, six étapes, une fenêtre où la lucidité s'installe","body":"Une décision n'est pas un instant — c'est une cascade qui se déploie en moins d'une seconde dans votre cerveau. La séquence est mesurée :\n\n- **Capteurs sensoriels (0 ms)** — information brute (visuel, auditif, somatique).\n- **Thalamus (10-20 ms)** — tri sensoriel, transmission rapide.\n- **Amygdale (30-50 ms)** — scan sécurité/danger. Si menace, déclenchement immédiat de la réponse stress.\n- **Hypothalamus (80-150 ms)** — réponse autonome (rythme cardiaque, respiration, posture).\n- **Striatum (150 ms)** — évaluation valeur/motivation, mobilisé par la dopamine.\n- **Cortex Préfrontal (300-600 ms)** — conscience, raisonnement, choix délibéré.\n\n**Implication critique** : **votre amygdale a déjà décidé environ 250 millisecondes avant que votre cortex préfrontal n'arrive en jeu**. Si vous laissez la décision se résoudre en moins d'une seconde, c'est l'amygdale et le striatum qui pilotent — pas votre raisonnement. Le contrôle des impulsions consiste précisément à **étendre cette fenêtre** au-delà d'une seconde, pour laisser le cortex préfrontal contribuer.\n\n**Régions clés impliquées dans le pesage des options** :\n\n- **CPFdl (Cortex Préfrontal Dorsolatéral)** : siège de la mémoire de travail et du raisonnement logique. Pèse les options.\n- **COF (Cortex Orbitofrontal)** : évalue la valeur émotionnelle de chaque option, intègre signaux de récompense et de punition.\n- **Striatum** : anticipe la récompense, activé par la dopamine.\n- **CCA (Cortex Cingulaire Antérieur)** : détecte les conflits entre options concurrentes — c'est le signal d'erreur qui vous pousse à réévaluer.\n\n**Biochimie associée** :\n- **Dopamine** : motive la recherche de solution, mais peut pousser à la précipitation (l'envie de « tenir une décision » prend le pas sur la qualité).\n- **Noradrénaline** : augmente la vigilance ; en excès, réduit la flexibilité cognitive — vous restez bloqué sur une seule option.\n- **Cortisol** : sous stress, **inhibe partiellement le CPF (Cortex Préfrontal)**. Le leader stressé décide avec moins de recul, plus vite, plus rigidement — bascule système 2 (lent, délibéré) vers système 1 (rapide, automatique).","citation":"*« Nous pouvons être aveugles à l'évidence, et nous pouvons aussi être aveugles à notre aveuglement. »* — Daniel Kahneman, *Thinking, Fast and Slow* (2011)"},{"num":4,"title":"Où en êtes-vous ? L'échelle de maîtrise","subtitle":"Cinq niveaux observables — de l'impulsion à la lucidité visionnaire","body":"Le modèle ÉVEIL distingue cinq niveaux comportementaux observables.\n\n**Niveau 1 — Impulsif**. Décide immédiatement, sans pause. Suit la première impression. Confond sa réaction avec une décision. *Impact* : décisions souvent révisées, équipe déstabilisée par les revirements.\n\n**Niveau 2 — Biaisé**. Décide vite mais sur la base d'attentes, de prédictions ou de schémas habituels — sans vérifier les faits. Confond ce qu'il voit avec ce qui est. *Impact* : décisions techniquement justes pour le mauvais problème.\n\n**Niveau 3 — Méthodique**. Analyse avant de décider. Pèse le pour et le contre. Mais peut être lent et rester en analyse. *Impact* : décisions solides mais parfois tardives, opportunités manquées.\n\n**Niveau 4 — Lucide**. Concilie analyse rapide et lecture émotionnelle. Sait quand accélérer et quand différer. Tolère l'incertitude. Vérifie l'écart entre prédiction et réalité. *Impact* : équipe en confiance, capacité à pivoter sans précipitation.\n\n**Niveau 5 — Visionnaire**. Décide avec une vision à long terme tout en restant adaptable. Tient l'écart entre certitude et incertitude sans s'effondrer. Inspire la confiance dans l'incertitude. *Impact* : leadership stratégique reconnu, alignement des équipes sur le cap malgré les turbulences.\n\nComme pour les autres axes, **vous n'êtes pas à un niveau fixe**. Probablement Niveau 4 sur les sujets dans votre zone d'expertise calme, Niveau 2 sur les sujets émotionnellement chargés où vos prédictions sont fortes, Niveau 1 sous fatigue extrême ou pression de temps.","citation":""},{"num":5,"title":"Application leadership : décider lucide sur 7 jours","subtitle":"Quatre leviers concrets pour activer la décision lucide","body":"La décision lucide se construit par des passages à l'acte délibérés. Quatre leviers à pratiquer cette semaine.\n\n**Levier 1 — La pause obligatoire avant chaque décision à enjeu**. Avant toute décision qui engage des moyens, des personnes ou de la durée, vous prenez **trois respirations longues** avant de répondre. Pas pour réfléchir — pour interrompre le tunnel amygdale → striatum et laisser le cortex préfrontal arriver. Ces 5 secondes ne ralentissent pas la décision — elles la **rendent possible**.\n\n**Levier 2 — Le test fait vs. prédiction**. Avant chaque décision, posez-vous explicitement : « Quelle partie de ce que je crois est un fait vérifié, et quelle partie est une prédiction de mon cerveau ? » Souvent, ce que vous prenez pour la situation est en réalité votre interprétation préliminaire. Cette question seule fait remonter le niveau de Sens de la réalité.\n\n**Levier 3 — La règle des trois alternatives**. Ne validez aucune décision tactique avant d'avoir formulé **au moins trois options** distinctes — y compris l'option « ne rien faire » et l'option « faire l'inverse ». Ce n'est pas pour les comparer toutes — c'est pour empêcher le cerveau de s'arrêter à la première solution venue. La résolution de problèmes ne s'active que si elle est forcée.\n\n**Levier 4 — Le test du temps approprié**. Toutes les décisions n'ont pas le même horizon. Avant de décider, demandez-vous : « Cette décision se révèle juste ou fausse en combien de temps ? » Une décision qui se révèle en 1 heure (où aller déjeuner) ne mérite pas l'analyse d'une décision qui se révèle en 5 ans (un investissement stratégique). Donnez à chaque décision **le temps proportionné à son horizon** — ni plus, ni moins.","citation":"*« La clarté intérieure crée la clarté extérieure. »* — ÉCA (École de la Cohérence Adaptative)"}],"questions":[{"num":1,"text":"Selon Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, 2011), la prise de décision est :","options":["La capacité à choisir vite entre plusieurs options","La capacité à évaluer objectivement une situation, à générer des solutions et à décider malgré l'incertitude","La capacité à imposer ses choix","La capacité à ne jamais se tromper"],"correct":1,"explanation":"La prise de décision (Decision Making) est le quatrième composite du modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0). Elle ne consiste ni à décider vite, ni à éviter l'erreur — elle consiste à articuler évaluation objective (Sens de la réalité), génération de solutions (Résolution de problèmes) et différé tactique (Contrôle des impulsions) malgré l'incertitude."},{"num":2,"text":"Les trois composantes de la prise de décision sont :","options":["Résolution de problèmes, Sens de la réalité, Contrôle des impulsions","Vitesse, Précision, Confiance","Analyse, Synthèse, Délégation","Vision, Stratégie, Tactique"],"correct":0,"explanation":"Bar-On (2011) décompose Decision Making en : Résolution de problèmes (Problem Solving — identifier, générer solutions, évaluer), Sens de la réalité (Reality Testing — percevoir les faits sans biais ni prédiction), Contrôle des impulsions (Impulse Control — créer un espace entre stimulus et réponse)."},{"num":3,"text":"Le « Sens de la réalité » dans le modèle Bar-On désigne :","options":["La capacité à imaginer des scénarios futurs","La capacité à percevoir les choses telles qu'elles sont, sans biais ni prédiction déformante","La capacité à accepter l'imperfection","La capacité à respecter les hiérarchies"],"correct":1,"explanation":"Le Sens de la réalité (Reality Testing) est la capacité à réduire l'écart entre la situation effective et votre lecture de cette situation. Le cerveau prédit en permanence (Module 1) et ces prédictions colorent ce que vous croyez voir. Demander « est-ce vérifié, ou seulement supposé ? » est l'opération centrale de cette composante."},{"num":4,"text":"Selon la cascade décisionnelle, l'amygdale a déjà déclenché une réponse en environ :","options":["5 secondes","1 seconde","30 à 50 millisecondes","1 minute"],"correct":2,"explanation":"Le scan sécurité/danger par l'amygdale s'effectue en 30-50 ms, soit environ 250 ms avant que le cortex préfrontal (300-600 ms) ne soit pleinement engagé dans la décision consciente. Si vous laissez la décision se résoudre en moins d'une seconde, c'est l'amygdale qui pilote — pas votre raisonnement délibéré. Le contrôle des impulsions consiste à étendre cette fenêtre."},{"num":5,"text":"Le CPFdl (Cortex Préfrontal Dorsolatéral) joue dans la décision le rôle de :","options":["Détecteur émotionnel","Siège de la mémoire de travail et du raisonnement logique qui pèse les options","Centre de l'intuition","Stockage des décisions passées"],"correct":1,"explanation":"Le CPFdl (Cortex Préfrontal Dorsolatéral) maintient en mémoire les options envisagées, leurs critères d'évaluation, et exécute le pesage logique. Le COF (Cortex Orbitofrontal) intègre la valeur émotionnelle. Le Striatum anticipe la récompense. Le CCA (Cortex Cingulaire Antérieur) détecte les conflits entre options. Les quatre travaillent ensemble — mais sans le CPFdl (Cortex Préfrontal Dorsolatéral), pas de raisonnement structuré."},{"num":6,"text":"Le cortisol chronique a pour effet sur la prise de décision de :","options":["La rendre plus rationnelle","Inhiber partiellement le cortex préfrontal et favoriser des décisions rapides moins nuancées","La rendre plus créative","L'accélérer sans perte de qualité"],"correct":1,"explanation":"Sous stress prolongé, le cortisol réduit l'activité du cortex préfrontal, faisant basculer la décision vers les structures plus rapides mais moins flexibles (amygdale, striatum). C'est ce que Kahneman (2011) décrit comme la bascule du système 2 (lent, délibéré) vers le système 1 (rapide, automatique). Le leader stressé décide moins juste — pas par défaut moral, par mécanisme biologique."},{"num":7,"text":"Selon l'échelle ÉVEIL, le niveau « Biaisé » correspond à :","options":["Décider sans analyse, dans la précipitation","Décider vite mais sur la base d'attentes ou de prédictions, sans vérifier les faits","Analyser longuement avant de trancher","Décider en cohérence avec une vision long terme"],"correct":1,"explanation":"Le niveau 2 « Biaisé » désigne celui qui prend le temps de « réfléchir » mais raisonne sur des données préfiltrées par ses prédictions cérébrales. Le niveau 1 « Impulsif » ne réfléchit pas. Le niveau 3 « Méthodique » analyse correctement mais lentement. Le niveau 4 « Lucide » concilie vitesse et lecture juste de la réalité."},{"num":8,"text":"Avant une décision à enjeu, le levier le plus efficace pour activer le cortex préfrontal est :","options":["Décider rapidement avant de douter","Demander l'avis de plusieurs personnes","Trois respirations longues avant de répondre, pour interrompre la cascade amygdale-striatum","Repousser la décision au lendemain"],"correct":2,"explanation":"Trois respirations longues (≈10 secondes) suffisent à interrompre le tunnel décisionnel amygdale → striatum et à laisser le cortex préfrontal entrer dans la boucle. Ce n'est pas pour réfléchir — c'est pour rendre la réflexion physiologiquement possible. Reporter au lendemain est utile pour les vraies décisions stratégiques, mais pas applicable aux micro-décisions du quotidien. Demander des avis sans avoir d'abord régulé son état mène à un consensus biaisé."}],"imageStimulus":{"description":"Un cadre dirigeant face à son écran. Un mail vient d'arriver — l'objet contient « URGENT » en majuscules. Doigt déjà sur le clavier, prêt à répondre. Visage tendu, mâchoire crispée. Café noir froid à côté. La pendule indique 17h47.","consigne":"À quel niveau de l'échelle est cette personne au moment où elle s'apprête à répondre — Impulsif, Biaisé, Méthodique, Lucide, Visionnaire ? **Quelle pression émotionnelle** pilote sa réponse imminente ? Si tu te reconnais dans ce moment, **quelle micro-action** concrète changerait le niveau de la réponse ?","imageFile":"8.jpeg"},"casPratique":{"title":"Mise en pratique — Sept jours de décisions lucides","scenario":"Pendant les **7 prochains jours**, identifie chaque jour **une décision à enjeu** que tu prends (validation, arbitrage, réponse à une demande, choix de priorité). Avant de la prendre, applique les quatre leviers :\n\n1. **Pause** — trois respirations longues avant de répondre.\n2. **Test fait vs. prédiction** — quelle partie est vérifiée, quelle partie est supposée ?\n3. **Trois alternatives** — formule au moins trois options, y compris « ne rien faire ».\n4. **Temps approprié** — cette décision se révèle juste ou fausse dans quel horizon ? Donne-lui le temps proportionné.\n\nÀ la fin de chaque jour, note : (1) la décision prise, (2) à quel niveau de l'échelle tu étais avant les leviers, (3) à quel niveau tu étais après, (4) ce que les leviers ont changé concrètement.","ouverture":"Au bout de 7 jours, tu identifieras quel levier te coûte le plus (probablement celui que tu négliges d'habitude), et quel type de décision te fait systématiquement chuter de niveau (probablement les décisions émotionnellement chargées). Cette cartographie est la matière directe du Module 9 (Gestion du stress) — où le contrôle des impulsions rencontre la pression chronique."},"session":"RESET"},"M9":{"code":"M9","title":"GESTION DU STRESS","subtitle":"Répondre, pas réagir — flexibilité, tolérance, optimisme","color":"slate blue","duration":"20 minutes","ecrans":[{"num":1,"title":"Pourquoi tenir n'est pas suffire","subtitle":"Le cinquième axe du modèle Bar-On — l'intelligence sous pression","body":"Après les quatre premiers composites (Modules 4, 6, 7, 8), le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, Bar-On 2011) place la **gestion du stress** comme cinquième et dernier composite. C'est l'axe qui détermine si tout le reste **tient** sous pression — ou s'effondre dès que la situation devient difficile.\n\nLa gestion du stress se définit comme la capacité à s'adapter au changement, à supporter la pression sans s'effondrer, et à maintenir une disposition positive face à l'incertitude.\n\nLe verbe leader de cet axe est : **« Répondre, pas réagir »**.\n\nLa question-clé qu'un leader formé à ce modèle se pose : **« Quand tout vacille, est-ce que je réagis, ou est-ce que je réponds ? »**\n\nTrois conséquences pour le leadership :\n\n- **Le stress chronique coupe le cortex préfrontal**. Un leader sous stress prolongé perd progressivement accès à ses meilleures capacités — analyse, empathie, créativité — au profit de réactions automatiques. La performance baisse alors que l'effort augmente.\n- **La rigidité tue l'adaptation**. Vouloir maintenir le même cap à tout prix, dans un environnement qui change, n'est pas de la solidité — c'est une forme de fragilité différée. Les organisations qui survivent aux crises sont flexibles, pas rigides.\n- **Le pessimisme se contamine plus vite que l'optimisme**. Une équipe ne suit pas un leader convaincu que tout va mal, même s'il a raison sur les chiffres. La projection vers l'avant — sans déni — est une fonction du leader, pas une option.","citation":"*« Quand tout vacille, est-ce que je réagis, ou est-ce que je réponds ? »* — Question-clé du leader, modèle ÉVEIL"},{"num":2,"title":"Les trois composantes de la gestion du stress","subtitle":"Flexibilité, Tolérance au stress, Optimisme","body":"Bar-On (2011) décompose la gestion du stress en trois sous-échelles distinctes mais inséparables.\n\n**1. Flexibilité (Flexibility)** — La capacité à **adapter ses pensées, ses émotions et ses comportements** à des situations changeantes. Ce n'est pas changer de cap à tout vent — c'est ajuster les moyens quand les circonstances se modifient. La flexibilité distingue la solidité (qui plie sans casser) de la rigidité (qui résiste jusqu'à la rupture).\n\n**2. Tolérance au stress (Stress Tolerance)** — La capacité à **supporter activement** des situations difficiles, sans s'effondrer ni perdre ses moyens. C'est la maîtrise sous pression : continuer à penser, à décider, à se relier, à agir, alors même que les conditions sont défavorables. À ne pas confondre avec l'endurance passive — la tolérance est active, elle inclut la régulation.\n\n**3. Optimisme (Optimism)** — La capacité à maintenir une **disposition positive** face à l'incertitude, à percevoir les chemins possibles malgré les obstacles. Pas l'optimisme béat (« tout va bien se passer ») — l'optimisme structurel : « il existe des solutions, et ma responsabilité est de les chercher ». Martin Seligman (*Learned Optimism*, 1990) a documenté que cette disposition s'apprend et se cultive.\n\n**Articulation** : les trois forment un système. Sans flexibilité, la tolérance devient endurance rigide qui finit par casser. Sans tolérance, la flexibilité devient instabilité qui plie au moindre vent. Sans optimisme, les deux premières deviennent du masochisme professionnel — tenir et s'adapter sans horizon. Les trois ensemble = un leader qui tient debout dans la durée.","citation":""},{"num":3,"title":"Le substrat neuroanatomique : la courbe des 90 minutes","subtitle":"Cinq phases physiologiques d'une réponse au stress","body":"Une réponse complète au stress aigu se déploie sur environ 90 minutes — une trajectoire mesurée que tout leader doit connaître pour piloter ses interventions.\n\n- **Phase 1 — Déclenchement (0-2 min)** : adrénaline et noradrénaline saturent le système. Amygdale activée, cortex préfrontal partiellement inhibé. **C'est le pire moment pour décider, parler, réagir.**\n- **Phase 2 — Fenêtre d'intervention (3-10 min)** : l'adrénaline retombe, le cortisol n'est pas encore au pic. **C'est la fenêtre où la régulation est la plus efficace** (cohérence cardiaque, respiration, micro-pause). 7 minutes bien utilisées ici évitent 60 minutes de retombée difficile.\n- **Phase 3 — Montée du cortisol (10-25 min)** : début du pic hormonal. La mémoire émotionnelle s'active fortement, les biais et l'impulsivité augmentent.\n- **Phase 4 — Pic cortisol (40-60 min)** : sommet de la rétroaction négative. Cognition altérée. Inutile de chercher à raisonner ou décider à ce moment — le système est saturé.\n- **Phase 5 — Retour à l'équilibre (60-90 min)** : décrue du cortisol. Le système revient progressivement, mais l'événement reste **encodé** émotionnellement de façon durable.\n\nCette courbe, modélisée à partir des travaux de Hans Selye sur le syndrome général d'adaptation (*The Stress of Life*, 1956) et de la recherche contemporaine sur le cortisol, a une implication opérationnelle directe : **vous ne réglez pas un conflit en plein pic adrénalinique**. Vous régulez d'abord, vous parlez ensuite.\n\n**Régions cérébrales en jeu** :\n\n- **Amygdale** : déclenche la réponse stress en moins de 50 ms.\n- **Axe HHS (Hypothalamo-Hypophyso-Surrénalien)** : produit cortisol et adrénaline.\n- **Cortex Préfrontal** : **inhibé** sous stress, ce qui réduit raisonnement, empathie, créativité.\n- **Hippocampe** : sur-activé par le cortisol — la mémoire émotionnelle de l'épisode est sur-encodée.\n\n**Système nerveux autonome** (théorie polyvagale, Stephen Porges, 2011 — déjà rencontrée aux Modules 5 et 6) :\n\n- **Sympathique** : mobilise (combat ou fuite). Pupilles dilatées, cœur accéléré, muscles tendus, digestion suspendue.\n- **NV (Nerf Vague) ventral** : engagement social, lien, calme actif. La cohérence cardiaque l'active.\n- **NV (Nerf Vague) dorsal** : figement (immobilisation, effondrement). Quand la pression dépasse ce que le système peut traiter.\n\nRobert Sapolsky (*Why Zebras Don't Get Ulcers*, 2004) a montré que ce système, conçu pour des stress brefs (la course du zèbre fuyant le lion), devient toxique quand le stress devient chronique : pression au travail, conflits prolongés, anticipation permanente. Le corps reste activé sans phase de récupération — et c'est la santé qui paie.","citation":"*« Le stress n'est pas ce qui vous arrive. C'est ce que votre corps en fait. »* — Hans Selye, *The Stress of Life* (1956)"},{"num":4,"title":"Où en êtes-vous ? L'échelle de maîtrise","subtitle":"Cinq niveaux observables — du débordement à la souveraineté","body":"Le modèle ÉVEIL distingue cinq niveaux comportementaux observables.\n\n**Niveau 1 — Submergé**. Dépassé par la pression. Perd ses moyens dès que la situation devient difficile. Réagit dans la confusion ou se fige. *Impact* : équipe désorientée, décisions évitées ou erratiques, climat de crise permanent.\n\n**Niveau 2 — Réactif**. Réagit immédiatement à la pression — souvent par l'agressivité, la fermeture ou la précipitation. Pas de pause, pas de régulation. *Impact* : décisions prises dans le pic adrénalinique, décisions à refaire, équipe sous tension.\n\n**Niveau 3 — Résistant**. Tient bon. Mais en tension constante — corps crispé, sommeil dégradé, irritabilité de fond. Endurance sans récupération. *Impact* : performance maintenue à court terme, dégradation à moyen terme, burnout possible.\n\n**Niveau 4 — Régulé**. Sait reconnaître les signaux du stress (Module 4), active des outils de régulation (Module 5), retrouve son calme rapidement. Choisit ses combats. *Impact* : posture stable même en situation difficile, décisions justes sous pression, équipe rassurée.\n\n**Niveau 5 — Souverain**. Garde lucidité et calme dans la tempête. Sa stabilité est contagieuse. Inspire le sang-froid à l'équipe sans avoir à le formuler. Tient le cap stratégique malgré les turbulences. *Impact* : leadership reconnu en crise, équipe qui suit avec confiance, performance durable.\n\nComme pour les autres axes, **vous n'êtes pas à un niveau fixe**. Probablement Niveau 4 sur les pressions habituelles que vous avez appris à gérer, Niveau 2 sur les sujets qui touchent à votre image ou à vos valeurs profondes, Niveau 1 quand plusieurs pressions s'additionnent en même temps.","citation":""},{"num":5,"title":"Application leadership : répondre plutôt que réagir sur 7 jours","subtitle":"Quatre leviers concrets pour activer la gestion du stress","body":"La gestion du stress se renforce par des passages à l'acte délibérés. Quatre leviers à pratiquer cette semaine.\n\n**Levier 1 — Exploiter la fenêtre des 3-10 minutes**. Quand vous sentez la montée du stress (signal corporel, irritation, accélération du rythme — Module 4), **n'agissez pas dans les 2 premières minutes**. Sortez physiquement de la situation si possible, ou faites une micro-pause. Entre la 3e et la 10e minute, vous êtes dans la fenêtre où la régulation est la plus efficace. C'est là que vous activez la cohérence cardiaque (Module 5). Sept minutes bien utilisées évitent 60 minutes de retombée difficile.\n\n**Levier 2 — Tester votre rigidité une fois par jour**. Repérez chaque jour **un « il faut absolument que… »** dans votre tête. Demandez-vous : est-ce vraiment indispensable ou est-ce une rigidité ? Quelles seraient les autres voies ? La flexibilité ne consiste pas à abandonner — elle consiste à distinguer le **but** (souvent stable) des **moyens** (qui peuvent varier). Si vous ne distinguez pas les deux, vous transformez chaque obstacle de moyen en échec total.\n\n**Levier 3 — Faire le scan des récupérations**. À la fin de chaque journée, identifiez : qu'est-ce qui m'a **rechargé** aujourd'hui ? (un échange, un moment de calme, un exercice physique, un repas pris vraiment, un succès même petit). La tolérance au stress n'est pas un trait de caractère — c'est le ratio entre charge et récupération. Sans récupération identifiée, la charge s'accumule.\n\n**Levier 4 — La question optimiste opérationnelle**. Face à une difficulté, après avoir nommé la difficulté (pas la nier), posez-vous : **« qu'est-ce qui reste possible à partir d'ici ? »**. Pas « tout ira bien » (déni). Pas « c'est foutu » (effondrement). « Qu'est-ce qui reste possible » — c'est l'optimisme structurel de Seligman, le moteur qui ouvre des chemins là où le pessimisme les ferme.","citation":"*« La clarté intérieure crée la clarté extérieure. »* — ÉCA (École de la Cohérence Adaptative)"}],"questions":[{"num":1,"text":"Selon Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, 2011), la gestion du stress est :","options":["La capacité à éviter les situations stressantes","La capacité à s'adapter au changement, à supporter la pression et à maintenir une disposition positive face à l'incertitude","La capacité à ne plus ressentir le stress","La capacité à travailler beaucoup d'heures"],"correct":1,"explanation":"La gestion du stress (Stress Management) est le cinquième composite Bar-On — l'intelligence sous pression. Elle ne consiste ni à éviter, ni à supprimer, ni à endurer passivement. Elle articule trois capacités actives : adaptation (Flexibilité), maîtrise sous pression (Tolérance au stress), et projection positive (Optimisme)."},{"num":2,"text":"Les trois composantes de la gestion du stress sont :","options":["Flexibilité, Tolérance au stress, Optimisme","Endurance, Persévérance, Résistance","Calme, Patience, Sérénité","Méditation, Sport, Sommeil"],"correct":0,"explanation":"Bar-On (2011) décompose Stress Management en : Flexibilité (Flexibility — adaptation à des situations changeantes), Tolérance au stress (Stress Tolerance — supporter activement la pression), Optimisme (Optimism — maintenir disposition positive face à l'incertitude)."},{"num":3,"text":"La flexibilité, dans le modèle Bar-On, se distingue de l'instabilité en ce qu'elle :","options":["Évite tout changement de stratégie","Distingue le but (stable) des moyens (qui peuvent varier)","Suit toujours l'avis du groupe","Change de cap à chaque difficulté"],"correct":1,"explanation":"La flexibilité saine n'abandonne pas le but — elle ajuste les moyens quand les circonstances changent. L'instabilité, à l'inverse, change tout au moindre obstacle. La rigidité, à l'autre extrême, refuse tout ajustement même quand les moyens deviennent inopérants. Le leader formé sait quel niveau du système il modifie."},{"num":4,"text":"Selon la courbe de réponse au stress (0-90 min), la fenêtre la plus efficace pour intervenir est :","options":["Dans les 2 premières minutes","Entre la 3e et la 10e minute, avant le pic de cortisol","Au moment du pic à 40-60 min","Après 90 minutes, au retour à l'équilibre"],"correct":1,"explanation":"Dans les 2 premières minutes, l'adrénaline sature le système et le cortex préfrontal est inhibé — agir ou parler à ce moment empire la situation. Entre 3 et 10 minutes, l'adrénaline retombe et le cortisol n'est pas encore au pic : c'est la fenêtre optimale pour la régulation (cohérence cardiaque, respiration, pause physique). Au pic (40-60 min), le système est saturé. Mieux vaut différer toute conversation difficile."},{"num":5,"text":"Selon la théorie polyvagale de Stephen Porges, le NV (Nerf Vague) ventral est associé à :","options":["La fuite ou le combat","L'engagement social, le lien et le calme actif","Le figement et l'effondrement","La rumination cognitive"],"correct":1,"explanation":"Porges (2011) distingue trois branches de réponse au stress : NV (Nerf Vague) ventral (engagement social, calme actif, prosodie de la voix — activé par la cohérence cardiaque), sympathique (combat/fuite), NV (Nerf Vague) dorsal (figement, immobilisation, effondrement quand la pression dépasse ce que le système peut traiter). Un leader régulé garde majoritairement son NV (Nerf Vague) ventral actif, même sous pression."},{"num":6,"text":"Selon Sapolsky (2004), le stress chronique se distingue du stress aigu par :","options":["Sa moindre intensité","L'absence de phase de récupération entre les épisodes","Le fait qu'il n'affecte pas la santé","Sa survenue uniquement chez les animaux"],"correct":1,"explanation":"Sapolsky (*Why Zebras Don't Get Ulcers*, 2004) a montré que le système de réponse au stress, conçu pour des épisodes brefs (la course du zèbre fuyant le lion), devient toxique quand il fonctionne en continu. Sans phase de récupération, le cortisol reste élevé, l'hippocampe est endommagé, le système immunitaire affaibli, le sommeil dégradé. Ce n'est pas l'intensité du stress qui détruit — c'est l'absence de récupération."},{"num":7,"text":"Selon l'échelle ÉVEIL, le niveau « Résistant » correspond à :","options":["Être dépassé par la pression","Réagir immédiatement sans contrôle","Tenir bon mais en tension constante, sans récupération","Garder lucidité et calme dans la tempête"],"correct":2,"explanation":"Le niveau 3 « Résistant » désigne celui qui tient bon — performance maintenue, engagements honorés — mais en endurance sans récupération. Corps crispé, sommeil dégradé, irritabilité de fond. C'est un niveau qui paraît efficace à court terme mais qui mène au burnout à moyen terme. Le passage au niveau 4 « Régulé » consiste précisément à intégrer la récupération comme partie du travail."},{"num":8,"text":"La question optimiste opérationnelle, selon Martin Seligman, est :","options":["« Tout va bien se passer »","« C'est foutu »","« Qu'est-ce qui reste possible à partir d'ici ? »","« Pourquoi cela m'arrive-t-il à moi ? »"],"correct":2,"explanation":"Seligman (*Learned Optimism*, 1990) distingue l'optimisme béat (déni de la difficulté), le pessimisme (effondrement), et l'**optimisme structurel** — qui reconnaît la difficulté et cherche les chemins possibles. La question « qu'est-ce qui reste possible à partir d'ici ? » ouvre un espace de solutions là où « tout va bien » ferme par déni et où « c'est foutu » ferme par effondrement."}],"imageStimulus":{"description":"Une réunion de crise. Cinq personnes autour d'une table. Une personne au centre — c'est elle qui doit décider — visage tendu, pupilles légèrement dilatées, mâchoire serrée. Sur la table, un tableau de bord avec des chiffres en rouge. La pendule indique 14h22, l'air est lourd.","consigne":"À quelle phase de la courbe stress est probablement cette personne (Déclenchement / Fenêtre d'intervention / Montée cortisol / Pic / Retour) ? **Quel signal corporel** te le révèle le plus clairement ? Si tu te reconnais dans cette posture lors de réunions à enjeu, **quelle micro-action** concrète activerais-tu maintenant pour basculer dans la fenêtre d'intervention ?","imageFile":"9.jpeg"},"casPratique":{"title":"Mise en pratique — Sept jours de « répondre, pas réagir »","scenario":"Pendant les **7 prochains jours**, à chaque montée de stress identifiée pendant la journée :\n\n1. **Repère la phase** — quel signal corporel te dit que tu es entré en réponse stress (gorge serrée, mâchoire crispée, accélération cardiaque, tunnel attentionnel) ?\n2. **Si phase 1 (0-2 min) — n'agis pas**. Sors physiquement de la situation si possible, ou différe toute parole et toute décision.\n3. **Si phase 2 (3-10 min) — régule**. Cohérence cardiaque (Module 5), trois respirations longues, ancrage corporel. Puis seulement, parle ou décide.\n4. **Le soir, fais le bilan** : (a) combien de fois j'ai bien utilisé la fenêtre d'intervention, (b) combien de fois j'ai réagi dans le pic, (c) qu'est-ce qui m'a rechargé aujourd'hui, (d) qu'est-ce qui reste possible demain.","ouverture":"Au bout de 7 jours, tu identifieras ton **déclencheur dominant** (le type de situation qui te fait basculer le plus souvent), la **phase où tu décroches le plus** (probablement entre 0-2 min ou 10-25 min), et le **levier de régulation** qui marche le mieux pour toi. Cette cartographie te donne la trame de tes 90 prochains jours de pratique — et clôt le parcours sur un acquis directement applicable au quotidien de leader."},"session":"VOL_AIGLE"},"M10":{"code":"M10","title":"SYNTHÈSE IE","subtitle":"Vivre aligné — l'intelligence émotionnelle comme cohérence intégrative","color":"gold","duration":"25 minutes","ecrans":[{"num":1,"title":"Du catalogue à l'incarnation","subtitle":"Pourquoi la synthèse ne se fait pas toute seule","body":"Vous arrivez au dernier module du parcours d'ancrage. Neuf modules ont posé les briques :\n\n- **Module 1** vous a donné la grammaire du cerveau (8 réalités fondatrices, dont la prédiction permanente).\n- **Modules 2 et 3** ont précisé deux mécanismes essentiels : les six émotions de base (Ekman) et la plasticité cérébrale (Kandel, Doidge, Merzenich).\n- **Module 5** a installé l'auto-régulation comme socle physiologique.\n- **Modules 4, 6, 7, 8 et 9** ont parcouru les cinq axes du modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0, Bar-On 2011) — Perception de soi, Expression individuelle, Relations humaines, Prise de décision, Gestion du stress.\n\nL'enjeu de ce module final n'est pas d'ajouter un dixième contenu. **C'est de passer du catalogue à l'incarnation**. L'intelligence émotionnelle n'est pas une addition de compétences — c'est une **cohérence interne** qui se manifeste sur cinq dimensions à la fois. Daniel Goleman l'avait déjà signalé dans *Emotional Intelligence* (1995) : on ne devient pas émotionnellement intelligent par accumulation de techniques, on le devient par intégration progressive d'une posture.\n\nLe verbe leader de cette synthèse est : **« Vivre aligné »**.\n\nLa question-clé qu'un leader formé à ce modèle se pose : **« Est-ce que je vis ce que je sais — sur les cinq axes — au quotidien ? »**\n\nTrois conséquences pour le leadership :\n\n- **Savoir n'est pas faire**. Vous pouvez nommer parfaitement les six émotions (Module 2) et continuer à les ravaler. Vous pouvez connaître la courbe des 90 minutes (Module 9) et continuer à parler dans le pic. La connaissance sans pratique répétée ne change rien à votre cerveau.\n- **Le système ne se développe pas par à-coups**. Une formation, même intensive, fournit une carte. Le territoire se parcourt sur des mois, par la répétition (Module 3 — plasticité, médiane 66 jours pour une habitude stable).\n- **L'incohérence interne est lisible de l'extérieur**. Une équipe sent quand son leader sait sans incarner. Elle ne saura pas le formuler — elle le sentira physiologiquement, par les neurones miroirs (Module 7).","citation":"*« La clarté intérieure crée la clarté extérieure. »* — ÉCA (École de la Cohérence Adaptative)"},{"num":2,"title":"La roue Bar-On — vue intégrée","subtitle":"Cinq composites, quinze sous-échelles, une cohérence","body":"Le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0) organise l'intelligence émotionnelle en cinq composites, chacun décomposé en trois sous-échelles. La roue n'est pas un découpage arbitraire — elle reflète un ordre logique de développement.\n\n**Axe 1 — Perception de soi** (verbe leader : **Se lire**)\n*Amour-propre · Réalisation de soi · Conscience de soi émotionnelle*\nSans cette base, tout le reste s'effondre. C'est le miroir intérieur.\n\n**Axe 2 — Expression individuelle** (verbe leader : **Faire entendre sa voix**)\n*Expression émotionnelle · Affirmation de soi · Indépendance*\nUne fois que vous vous lisez, vous pouvez oser dire — exprimer, affirmer, tenir.\n\n**Axe 3 — Relations humaines** (verbe leader : **Reconnaître l'autre**)\n*Relations humaines · Empathie · Responsabilité sociale*\nL'expression rencontre alors l'autre — non pour s'imposer, mais pour se relier.\n\n**Axe 4 — Prise de décision** (verbe leader : **Décider lucide**)\n*Résolution de problèmes · Sens de la réalité · Contrôle des impulsions*\nÀ partir d'une lecture juste de soi et des autres, la décision devient possible — et lucide.\n\n**Axe 5 — Gestion du stress** (verbe leader : **Répondre, pas réagir**)\n*Flexibilité · Tolérance au stress · Optimisme*\nEt tout cela doit tenir sous pression — sinon le système s'effondre dès la première crise.\n\n**L'articulation systémique** : ces cinq axes ne sont pas indépendants. Un déficit majeur sur **un seul axe affecte les quatre autres**. Une perception de soi faible (Axe 1) compromet l'expression authentique (Axe 2), la lecture de l'autre (Axe 3), la qualité décisionnelle (Axe 4) et la régulation sous pression (Axe 5). Inversement, une avancée sur un axe fait progresser les autres par effet de cohérence.\n\nC'est pour cela que la stratégie de développement n'est jamais : « je travaille les cinq en même temps ». C'est : **« je travaille l'axe le plus déficitaire, celui dont la progression débloque le plus le système »**.","citation":""},{"num":3,"title":"Le Bien-être — l'indicateur global","subtitle":"Pas un sixième axe, un thermomètre du système","body":"Le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0) inclut, en plus des cinq composites, un **indicateur de Bien-être (Well-Being Indicator)** — souvent appelé Happiness dans la version anglaise. Ce n'est **pas un sixième composite**. C'est un thermomètre global qui signale l'état de cohérence du système.\n\nLe Bien-être Bar-On articule trois dimensions :\n\n**1. Satisfaction de vie** — un sentiment global de contentement avec ce que vous vivez, sans pour autant exclure les difficultés. Pas l'optimisme situationnel (Module 9, Axe 5) — un état plus profond, lié au sens.\n\n**2. Vitalité** — l'énergie disponible. Le corps qui se réveille avec ressort, le mental qui démarre avec disponibilité, l'enthousiasme à l'idée de la journée. Cette dimension est très corporelle — elle se mesure plus dans la posture que dans le discours.\n\n**3. Joie / Sens** — le sentiment que ce que vous faites a une portée, que votre vie a une cohérence avec ce qui vous importe. C'est ce qu'a appelé Mihály Csikszentmihalyi le « flow » dans ses travaux sur l'expérience optimale (*Flow: The Psychology of Optimal Experience*, 1990) : ces moments où l'effort, l'attention et le sens convergent.\n\n**Implication critique** : le Bien-être n'est **pas un objectif à viser directement**. C'est un **résultat indirect** d'une intelligence émotionnelle cohérente. Plus vous progressez sur les cinq axes, plus le Bien-être monte — sans avoir à le travailler comme tel. Inversement, un Bien-être bas n'est pas une faiblesse à corriger frontalement — c'est un signal qui pointe vers les axes où le système est en déséquilibre.\n\nC'est l'idée centrale du principe ÉCA (École de la Cohérence Adaptative) : **« La clarté intérieure crée la clarté extérieure »**. Le bien-être suit la cohérence, il ne la précède pas.","citation":"*« Le bonheur n'est pas quelque chose que l'on poursuit ; c'est quelque chose qui découle de l'engagement plein dans une activité qui a du sens. »* — D'après Mihály Csikszentmihalyi (1990)"},{"num":4,"title":"La cartographie personnelle","subtitle":"Votre profil intégré — où vous en êtes, où vous allez","body":"À ce stade du parcours, vous disposez de tous les éléments pour construire votre **cartographie personnelle d'intelligence émotionnelle**. Trois questions structurent cette cartographie.\n\n**Question 1 — Sur quel axe êtes-vous le plus solide aujourd'hui ?**\nReprenez les cinq axes (Modules 4, 6, 7, 8, 9). Pour chacun, situez-vous spontanément sur l'échelle de maîtrise à 5 niveaux (du Niveau 1 au Niveau 5). N'idéalisez pas, ne dramatisez pas — soyez factuel. **L'axe où vous vous situez le plus haut est votre point d'ancrage** : c'est la base sur laquelle vous pouvez vous appuyer pour faire progresser les autres.\n\n**Question 2 — Sur quel axe êtes-vous le plus en marge de progression ?**\nL'axe où vous vous situez le plus bas est votre **point de progression prioritaire** — pas par culpabilité, mais par **levier**. C'est l'axe dont la progression débloque le plus le système. Si votre Perception de soi est à Niveau 2, travailler la Gestion du stress sans renforcer la perception de soi sera inefficace. Inversement, faire progresser la perception de soi de Niveau 2 à Niveau 3 fera bouger automatiquement les quatre autres axes.\n\n**Question 3 — Quel est votre signal d'alarme ?**\nQuand votre intelligence émotionnelle décroche, qu'est-ce qui apparaît en premier ? Repérez votre **canal de décompensation dominant** :\n- Corporel (tensions chroniques, sommeil dégradé) ?\n- Émotionnel (irritabilité, repli, anxiété diffuse) ?\n- Cognitif (rumination, tunnel attentionnel, biais répétitifs) ?\n- Comportemental (procrastination, évitement, micro-management, agressivité passive) ?\n- Relationnel (isolement, conflits récurrents, perte d'engagement de l'équipe) ?\n\nCe signal est votre **indicateur précoce** : il s'allume avant que vous ne soyez submergé. L'apprendre à le repérer, c'est gagner plusieurs heures voire plusieurs jours de marge de manœuvre.\n\n**Stratégie ÉCA (École de la Cohérence Adaptative)** : ne travaillez pas les cinq axes simultanément. Choisissez **un axe principal** pour les 90 prochains jours, en cohérence avec votre point d'ancrage et votre point de progression. Vivez cet axe quotidiennement. Le reste suivra par effet de cohérence.","citation":""},{"num":5,"title":"Application leadership : vos 90 prochains jours","subtitle":"De la formation à la pratique soutenue","body":"Le programme TRIVIUM s'achève. Mais l'ancrage neuronal, lui, ne fait que commencer (Module 3 — plasticité, médiane 66 jours pour une habitude stable). Voici les quatre leviers pour les 90 prochains jours.\n\n**Levier 1 — Choisir un axe principal et un seul**. Sur la base de votre cartographie (Écran 4), retenez **un axe** comme priorité de pratique. Pas trois. Un. Notez-le, datez-le. Donnez-vous 90 jours minimum avant d'évaluer l'effet. Pendant ces 90 jours, le verbe leader de cet axe (Se lire / Faire entendre sa voix / Reconnaître l'autre / Décider lucide / Répondre pas réagir) devient votre **boussole quotidienne**.\n\n**Levier 2 — Le scan des quatre signaux précoces, chaque jour**. Reprenez le protocole de M4 — corporel, émotionnel, cognitif, comportemental. Trois fois par jour, 30 secondes par scan. C'est cette régularité, pas la durée, qui ancre. Sans ce scan, votre cerveau retombe dans ses automatismes hérités.\n\n**Levier 3 — La cohérence cardiaque comme rituel quotidien**. Le protocole de M5 (3 fois par jour, 6 respirations par minute, 5 minutes — formule 365 de Servan-Schreiber) reste le socle physiologique. Sans régulation, les quatre autres modules se vident progressivement de leur effet sous la charge du quotidien.\n\n**Levier 4 — Une pratique sociale par semaine comme miroir**. Une fois par semaine, choisissez un échange à enjeu (entretien individuel, conversation difficile, prise de parole importante). Pratiquez-y consciemment l'axe que vous travaillez. Puis débriefez vous-même : qu'ai-je fait conformément au verbe leader ? Qu'ai-je raté ? Sans ce miroir social, la pratique reste introspective et ne transforme pas votre leadership effectif.\n\n**Le test de cohérence finale** : à la fin de chaque journée, posez-vous une question. Pas « ai-je été parfait ? ». La question juste est : **« Est-ce que ce que j'ai fait aujourd'hui est cohérent avec ce que je sais maintenant ? »**\n\nSi oui — peu importe le résultat, vous avez avancé. Si non — pas de jugement, juste un repérage. Demain est un autre jour de plasticité.","citation":"*« La clarté intérieure crée la clarté extérieure. Ce que je comprends en moi, je le vois. Ce que je clarifie en moi, je le crée autour de moi. »* — ÉCA (École de la Cohérence Adaptative)"}],"questions":[{"num":1,"text":"Selon Daniel Goleman (Emotional Intelligence, 1995), l'intelligence émotionnelle se développe :","options":["Par accumulation de techniques de communication","Par intégration progressive d'une posture, à travers la pratique répétée","Uniquement chez ceux qui ont une prédisposition innée","Par formation théorique intensive"],"correct":1,"explanation":"Goleman a popularisé le concept d'intelligence émotionnelle en montrant qu'elle ne se réduit pas à des techniques, et qu'elle ne dépend pas d'un don inné. Elle se développe par incarnation progressive d'une posture, ce qui suppose pratique répétée et plasticité (Module 3). La formation seule fournit la carte ; le territoire se parcourt par l'usage."},{"num":2,"text":"Le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0) organise l'intelligence émotionnelle en :","options":["4 composites et 12 sous-échelles","5 composites et 15 sous-échelles, plus un indicateur global de Bien-être","6 composites et 18 sous-échelles","3 grandes dimensions sans sous-divisions"],"correct":1,"explanation":"Bar-On (2011) structure l'intelligence émotionnelle en 5 composites (Perception de soi, Expression individuelle, Relations humaines, Prise de décision, Gestion du stress), chacun décomposé en 3 sous-échelles, soit 15 au total. Le Bien-être (Well-Being Indicator) n'est pas un 6e composite mais un indicateur global qui signale la cohérence du système."},{"num":3,"text":"L'articulation entre les 5 axes Bar-On signifie que :","options":["Les axes sont indépendants les uns des autres","Un déficit majeur sur un seul axe affecte les quatre autres","Il faut travailler les 5 axes en même temps","Chaque axe se développe à un rythme totalement séparé"],"correct":1,"explanation":"Les 5 axes forment un système. Un déficit sur la perception de soi (Axe 1) compromet l'expression (Axe 2), la lecture de l'autre (Axe 3), la décision (Axe 4) et la régulation (Axe 5). Inversement, une avancée sur un axe fait progresser les autres par cohérence. La stratégie n'est donc pas « tout travailler en même temps » mais « identifier l'axe dont la progression débloque le plus le système »."},{"num":4,"text":"Le Bien-être (Well-Being Indicator) dans le modèle Bar-On EQ-i 2.0 (Emotional Quotient Inventory 2.0) est :","options":["Le 6e composite à travailler en parallèle","Un indicateur global qui résulte de la cohérence des 5 composites","Un préalable nécessaire avant de travailler les autres axes","Un trait de caractère stable indépendant des autres composantes"],"correct":1,"explanation":"Le Bien-être n'est pas un objectif à viser frontalement — c'est un résultat indirect d'une intelligence émotionnelle cohérente. Travailler les 5 composites avec rigueur fait monter le Bien-être. À l'inverse, un Bien-être bas est un signal qui pointe vers les axes en déséquilibre. C'est l'idée du principe ÉCA (École de la Cohérence Adaptative) : la clarté intérieure crée la clarté extérieure."},{"num":5,"text":"Selon Mihály Csikszentmihalyi (1990), le flow (expérience optimale) correspond à :","options":["Un état de relaxation passive","La convergence entre effort, attention et sens dans une activité","La poursuite directe du bonheur comme objectif","Une dissolution complète de l'effort"],"correct":1,"explanation":"Csikszentmihalyi a documenté que les états d'expérience optimale (flow) surviennent quand effort, attention et sens convergent dans une activité — pas quand on poursuit le bonheur en lui-même. Le bonheur, dans ce cadre, est un sous-produit de l'engagement plein, pas une cible directe. Cette idée est centrale dans la dimension Bien-être du modèle Bar-On."},{"num":6,"text":"Le verbe leader synthèse pour M10 est :","options":["Tenir","Performer","Vivre aligné","Optimiser"],"correct":2,"explanation":"« Vivre aligné » capture l'enjeu de la synthèse — passer du catalogue de connaissances à la cohérence intégrée entre ce qu'on sait, ce qu'on sent, ce qu'on dit et ce qu'on fait. C'est l'incarnation de tous les axes simultanément. Tenir relève de l'Axe 5 seul. Performer est un résultat, pas une cause. Optimiser est de l'ordre du moyen, pas de la finalité."},{"num":7,"text":"Selon la stratégie ÉCA (École de la Cohérence Adaptative), pour faire progresser votre intelligence émotionnelle, vous devez :","options":["Travailler les 5 axes simultanément","Commencer par le plus difficile pour vous prouver quelque chose","Choisir UN axe principal — votre point de progression prioritaire — pour 90 jours minimum","Attendre une nouvelle formation avant d'agir"],"correct":2,"explanation":"La plasticité (Module 3) impose une logique de focalisation. Travailler simultanément 5 axes dilue le renforcement neuronal et n'ancre rien. Identifier votre point de progression prioritaire (l'axe dont la progression débloque le plus le système) et le pratiquer 90 jours minimum, pendant lesquels les autres axes progressent automatiquement par cohérence — c'est la stratégie efficace."},{"num":8,"text":"Le test de cohérence quotidienne le plus juste à se poser le soir est :","options":["« Ai-je été parfait aujourd'hui ? »","« Est-ce que ce que j'ai fait aujourd'hui est cohérent avec ce que je sais maintenant ? »","« Ai-je atteint tous mes objectifs ? »","« Les autres ont-ils été contents de moi ? »"],"correct":1,"explanation":"La perfection est un piège qui culpabilise sans transformer. Les objectifs et la satisfaction des autres sont des résultats, pas des indicateurs de pratique. La question juste mesure la **cohérence interne** — ai-je vécu ce que je sais ? Si oui, j'avance, peu importe le résultat extérieur. Si non, je repère sans me juger, et demain reste un autre jour de plasticité."}],"imageStimulus":{"description":"Un dirigeant en fin de journée dans son bureau silencieux. Devant lui, un carnet ouvert avec quelques lignes manuscrites. Il regarde ses notes, calme. La fenêtre derrière lui montre un function makeParticipantEmail(participantId) {
  return participantId.toLowerCase() + '@warda.octogo.local';
